<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<meta name="description" content="Cálculos, patologías, técnicas, fármacos, ECG y quiz para enfermería y terapia intensiva.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bolsillo">
<title>Bolsillo de Enfermería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: cuaderno de bolsillo en una columna, encabezado negro, pestañas fijas abajo, resultados tipo monitor.
   Identidad: blanco, rojo, gris y negro. Fredoka para títulos, Atkinson Hyperlegible para leer. */
:root{
  --bg:#F2F2F3; --surface:#FFFFFF; --ink:#141416; --muted:#5E5E66; --line:#DEDEE3;
  --accent:#C8102E; --accent-btn:#D90429; --accent-ink:#FFFFFF; --accent-soft:#FDE6E9; --accent-deep:#7D0017;
  --ok:#15703F; --ok-soft:#DDF3E6; --warn:#8A5200; --warn-soft:#FBEBCC; --crit:#A60F1E; --crit-soft:#FADADD; --crit-solid:#B3001B;
  --screen:#0B0B0D; --screen-ink:#FF5C6C; --screen-dim:#9A9AA3; --screen-line:#2A2A30;
  --ecg-bg:#FFF5F5; --ecg-minor:#F8D9DC; --ecg-major:#EDADB4; --ecg-trace:#141416;
  --art-bg:#FDEBED; --g1:#E6E6EA; --g2:#B9B9C1;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Fredoka","Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0D0F; --surface:#18181B; --ink:#F4F4F5; --muted:#A1A1AA; --line:#2D2D33;
    --accent:#FF6B7A; --accent-btn:#E5243B; --accent-soft:#3A1319;
    --ok:#5CD08F; --ok-soft:#12331F; --warn:#F0B35A; --warn-soft:#3A2B0C; --crit:#FF6B7A; --crit-soft:#3F151B; --crit-solid:#C8102E;
    --screen:#000000; --screen-ink:#FF6B7A; --screen-dim:#8E8E96; --screen-line:#2A2A2F;
    --ecg-bg:#0A0A0B; --ecg-minor:#2B1519; --ecg-major:#4D2128; --ecg-trace:#FFFFFF;
    --art-bg:#2A1418; --g1:#2B2B30; --g2:#55555D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0D0F; --surface:#18181B; --ink:#F4F4F5; --muted:#A1A1AA; --line:#2D2D33;
  --accent:#FF6B7A; --accent-btn:#E5243B; --accent-soft:#3A1319;
  --ok:#5CD08F; --ok-soft:#12331F; --warn:#F0B35A; --warn-soft:#3A2B0C; --crit:#FF6B7A; --crit-soft:#3F151B; --crit-solid:#C8102E;
  --screen:#000000; --screen-ink:#FF6B7A; --screen-dim:#8E8E96; --screen-line:#2A2A2F;
  --ecg-bg:#0A0A0B; --ecg-minor:#2B1519; --ecg-major:#4D2128; --ecg-trace:#FFFFFF;
  --art-bg:#2A1418; --g1:#2B2B30; --g2:#55555D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 16px/1.5 var(--font-body);
  padding-block:12px 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:640px;margin-inline:auto}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h2{font:600 20px/1.25 var(--font-display);letter-spacing:-.01em;text-wrap:balance}

.brand{display:flex;align-items:center;gap:12px;padding:8px 0 16px}
.mark{flex:none;width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand h1{font:600 20px/1.2 var(--font-display);letter-spacing:-.01em}
.brand p{color:var(--muted);font-size:14px;margin-top:2px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.groups{padding-bottom:8px}
.groups .chip{font-family:var(--font-display);font-weight:600}
.chip{flex:none;min-height:40px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.lead{color:var(--muted);font-size:15px;margin:4px 0 14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.field{min-width:0}
.field label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px}
input,select{width:100%;min-height:48px;padding:10px 12px;font-size:17px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
select{text-overflow:ellipsis}

.monitor{background:var(--screen);color:var(--screen-ink);border:1px solid var(--screen-line);border-radius:14px;padding:16px;margin-bottom:12px}
.monitor .lbl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--screen-dim);font-weight:700}
.monitor .read{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:4px}
.monitor .val{font:600 clamp(44px,15vw,64px)/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.monitor .unit{font-size:16px;color:var(--screen-dim)}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--screen-line)}
.extras dt{font-size:12px;color:var(--screen-dim);letter-spacing:.05em;text-transform:uppercase}
.extras dd{margin:2px 0 0;font:600 18px var(--font-display);font-variant-numeric:tabular-nums;color:var(--screen-ink)}
.monitor.idle .val{color:var(--screen-dim)}

.verdict{padding:12px 14px;border-radius:10px;font-weight:700;background:var(--accent-soft);color:var(--ink);margin-bottom:12px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.verdict.crit{background:var(--crit-soft);color:var(--crit)}
.tip{font-size:14px;color:var(--muted);margin-bottom:12px}
.how{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.how summary{cursor:pointer;padding:12px 16px;font-weight:700;min-height:48px;display:flex;align-items:center}
.how .how-body{padding:0 16px 14px;display:grid;gap:8px}
.how .how-body p{font:500 15px/1.5 var(--font-display);font-variant-numeric:tabular-nums}

table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 0;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--muted);padding-right:12px;width:46%}
td{font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
h3.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}

.searchbox{margin-bottom:12px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:60px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.acc[open] summary::after{transform:rotate(-135deg)}
.acc-name{font:600 17px/1.3 var(--font-display);min-width:0}
.tag{display:inline-block;margin-top:2px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.acc-body{padding:0 16px 16px}
.acc-body ul{margin:0;padding-left:20px;display:grid;gap:4px}
.alarm{background:var(--crit-soft);border-radius:10px;padding:2px 14px 12px;margin-top:16px}
.alarm h3.sec{color:var(--crit)}
.key{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-top:16px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:28px 0}

.prog{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.step{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer;color:var(--ink)}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 13px var(--font-display);color:var(--muted);font-variant-numeric:tabular-nums}
.step .n::before{content:attr(data-n)}
.step .t{min-width:0;padding-top:3px}
.step[aria-pressed="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step[aria-pressed="true"] .n::before{content:"✓"}
.step[aria-pressed="true"] .t{color:var(--muted)}
.btn{min-height:48px;padding:12px 20px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.qhead{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
.qtext{font:600 19px/1.35 var(--font-display);margin:10px 0 16px;text-wrap:balance}
.opt{display:block;width:100%;text-align:left;min-height:52px;padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--crit);background:var(--crit-soft)}
.opt:disabled{cursor:default;opacity:1}
.score{font:600 56px/1 var(--font-display);font-variant-numeric:tabular-nums;margin:6px 0}
.missed{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.missed li{border-top:1px solid var(--line);padding-top:10px}
.missed b{display:block}

.ecg{display:block;width:100%;height:auto;border-radius:10px;background:var(--ecg-bg)}
.trace{fill:none;stroke:var(--ecg-trace);stroke-width:1.7;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.strip-cap{font-size:12px;color:var(--muted);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.anno{display:block;width:100%;height:auto}
.anno text{font:600 4px var(--font-body);fill:var(--ink)}
.anno .dim{stroke:var(--accent);stroke-width:1;fill:none}
.anno .baseline{stroke:var(--muted);stroke-width:.3;stroke-dasharray:1.5 1.5;fill:none}
.t3 th{width:34%}
.t3 td{padding-left:8px}
.urg h3.sec{color:var(--crit)}
.urg ul{margin:0;padding-left:20px;display:grid;gap:4px}
.note{color:var(--muted);font-size:13px;margin-top:20px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;padding:4px 0;color:var(--muted);font-size:11px;font-weight:700;text-decoration:none;border-radius:10px}
.tabs .ic{width:48px;height:28px;border-radius:14px;display:grid;place-items:center}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs a[aria-current="page"] .ic{background:var(--accent-soft)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ================= Identidad visual: blanco, rojo, gris y negro ================= */
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes drawline{0%{stroke-dashoffset:40}45%,100%{stroke-dashoffset:0}}
@keyframes ringpulse{0%,100%{box-shadow:0 0 0 0 rgba(217,4,41,.35)}50%{box-shadow:0 0 0 6px rgba(217,4,41,0)}}
@keyframes fall{to{transform:translateY(300px) rotate(540deg);opacity:0}}

body{background:var(--bg)}
h2{font-family:var(--font-display);font-weight:600;letter-spacing:0}
.card>h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent-btn);margin-right:9px;vertical-align:2px}

/* Encabezado */
.brand{background:#0B0B0D;color:#fff;border:2px solid #0B0B0D;border-radius:22px;padding:14px 16px;margin:2px 0 14px;gap:12px;position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;right:-34px;top:-34px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(217,4,41,.45),transparent 70%);pointer-events:none}
.brand h1{font-family:var(--font-display);font-weight:600;font-size:21px;color:#fff}
.brand p{color:#B4B4BC;font-size:13.5px}
.mark{width:46px;height:46px;border-radius:14px;background:var(--accent-btn);color:#fff;box-shadow:0 4px 0 var(--accent-deep)}
.mark .pulse{stroke-dasharray:40;animation:drawline 3.4s ease-in-out infinite}
.pts{margin-left:auto;position:relative;z-index:1;display:flex;align-items:center;gap:6px;background:#1D1D21;border:2px solid #34343A;color:#fff;border-radius:999px;padding:5px 12px 5px 9px;font:600 16px var(--font-display);font-variant-numeric:tabular-nums}
.pts svg{width:20px;height:20px;fill:var(--screen-ink)}
.pts.pop{animation:pop .4s}

/* Chips */
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14.5px;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--accent-btn);border-color:var(--accent-btn);color:#fff;box-shadow:0 3px 0 var(--accent-deep)}
.groups .chip{font-family:var(--font-display);font-weight:600;font-size:15.5px}

/* Tarjetas y campos */
.card{border:2px solid var(--line);border-radius:20px;box-shadow:0 3px 0 var(--line);animation:rise .28s ease both}
input,select{border:2px solid var(--line);border-radius:12px;background:var(--surface)}
input:focus,select:focus{outline:none;border-color:var(--accent-btn);box-shadow:0 0 0 4px var(--accent-soft)}
:focus-visible{outline:3px solid var(--accent-btn);outline-offset:2px}

/* Monitor de resultados */
.monitor{background:var(--screen);border:2px solid #000;border-radius:20px;box-shadow:0 3px 0 var(--line);position:relative;overflow:hidden}
.monitor::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(217,4,41,.4),transparent 70%);pointer-events:none}
.monitor .val{font-family:var(--font-display);font-weight:600;color:var(--screen-ink)}
.monitor .lbl,.monitor .unit,.extras dt{color:var(--screen-dim)}
.extras dd{color:#fff}
.monitor.idle .val{color:var(--screen-dim)}

/* Mensajes con ícono */
.verdict{display:flex;gap:10px;align-items:flex-start;border-radius:14px;background:var(--g1);color:var(--ink);font-weight:700}
.verdict::before{content:"i";flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:700 13px var(--font-display)}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.ok::before{content:"✓";background:var(--ok);color:var(--surface)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.verdict.warn::before{content:"!";background:var(--warn);color:var(--surface)}
.verdict.crit{background:var(--crit-solid);color:#fff}
.verdict.crit::before{content:"!";background:#fff;color:var(--crit-solid)}
.how{border:2px solid var(--line);border-radius:16px}
.how summary{font-family:var(--font-display);font-weight:600}
th{color:var(--muted)}

/* Listas desplegables */
.acc{border:2px solid var(--line);border-radius:18px;box-shadow:0 3px 0 var(--line);margin-bottom:10px;overflow:hidden;animation:rise .25s ease both}
.acc[open]{border-color:var(--accent-btn)}
.acc summary{min-height:66px;gap:12px}
.acc-name{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.25}
.tag{color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:999px;margin-top:4px;font-size:11px}
.acc.is-done .acc-name::after{content:" ✓";color:var(--ok)}
.ico{flex:none;width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.key{position:relative;background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-weight:700}
.key::before{content:"Dato clave";display:block;font:700 11px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.alarm{background:var(--crit-soft);border:2px solid var(--crit);border-radius:14px}
.alarm h3.sec,.urg h3.sec{color:var(--crit)}

/* Pasos de técnicas */
.prog .bar{height:10px;border-radius:5px;background:var(--g1)}
.prog .bar i{background:var(--accent-btn);border-radius:5px}
.step{border-top:2px dashed var(--line);border-radius:12px;padding:12px 6px;transition:background .15s}
.step .n{width:34px;height:34px;border:2px solid var(--ink);color:var(--ink);background:var(--surface);font:600 14px var(--font-display)}
.step[aria-pressed="true"] .n{background:var(--accent-btn);border-color:var(--accent-btn);color:#fff;animation:pop .3s}
.step.next{background:var(--accent-soft)}
.step.next .n{border-color:var(--accent-btn);color:var(--accent);animation:ringpulse 1.6s ease-in-out infinite}
.done-banner{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:12px;animation:pop .4s}
.done-banner svg{flex:none;width:30px;height:30px;fill:none;stroke:var(--screen-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done-banner b{display:block;font:600 17px var(--font-display)}
.done-banner span{font-size:14px;opacity:.85}
.acc-body{position:relative}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.confetti i{position:absolute;top:-14px;width:9px;height:13px;border-radius:2px;animation:fall 1.5s ease-in forwards}
.pstat{background:var(--ink);color:var(--surface);border-radius:18px;padding:12px 16px;margin-bottom:12px}
.pstat b{font:600 20px var(--font-display)}
.pstat .prog{margin:8px 0 0}
.pstat .bar{background:#3A3A40}
.pstat .bar i{background:var(--screen-ink)}

/* Botones */
.btn{background:var(--accent-btn);color:#fff;border-radius:14px;box-shadow:0 4px 0 var(--accent-deep);font-family:var(--font-display);font-weight:600;font-size:17px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent-btn);box-shadow:0 3px 0 var(--accent-soft)}

/* Quiz */
.qtext{font-family:var(--font-display);font-weight:600}
.opt{border:2px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line);font-weight:700;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);animation:pop .3s}
.opt.wrong{border-color:var(--crit);background:var(--crit-soft);animation:shake .3s}
.score{font-family:var(--font-display);font-weight:600;color:var(--accent)}
.stars{display:flex;gap:6px;margin:4px 0 2px}
.stars svg{stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round;animation:pop .5s both}
.stars svg:nth-child(2){animation-delay:.12s}
.stars svg:nth-child(3){animation-delay:.24s}
.stars .on{fill:var(--accent-btn)}
.stars .off{fill:var(--g1)}

/* Navegación inferior */
.tabs{background:var(--surface);border-top:2px solid var(--line)}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs a[aria-current="page"] .ic{background:var(--accent-soft);animation:pop .3s}
.tabs a{font-size:10.5px;letter-spacing:-.1px}.tabs .ic{width:40px}

/* Ilustraciones de técnicas */
.art{display:block;width:100%;height:auto;border-radius:16px;background:var(--art-bg);margin-bottom:12px}
.art .o{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.art .n{fill:none}
.art .f-r{fill:var(--accent-btn)}
.art .f-rs{fill:var(--accent-soft)}
.art .f-k{fill:var(--ink)}
.art .f-g1{fill:var(--g1)}
.art .f-g2{fill:var(--g2)}
.art .f-w{fill:var(--surface)}
.art .f-s{fill:var(--screen)}
.art .pl{fill:none;stroke:var(--screen-ink);stroke-width:2.5;stroke-linejoin:round}
.art .vn{fill:none;stroke:var(--accent-btn);stroke-width:5;stroke-linecap:round}
.art .dl{fill:none;stroke:var(--accent-btn);stroke-width:2.5;stroke-dasharray:5 4;stroke-linecap:round}
.art text{font:600 10px var(--font-display);fill:var(--ink)}
.art .tw{fill:#fff}
.art .ts{fill:var(--screen-ink)}
.art .sm{font-size:8.5px}
.art .ck{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.thumb{flex:none;width:78px;height:37px;margin:0;border-radius:10px}
.thumb .o{stroke-width:1.2;vector-effect:non-scaling-stroke}
.thumb text{display:none}.thumb .pill{display:none}


/* Flujogramas */
.metas{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.meta{background:var(--ink);color:var(--surface);border-radius:999px;padding:4px 11px;font:600 13px var(--font-display)}
.hint{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.flow{display:flex;flex-direction:column;margin-bottom:12px}
.fn{display:block;width:100%;text-align:left;font:700 16px var(--font-body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 3px 0 var(--line)}
.fn small{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:3px;line-height:1.35}
button.fn{cursor:pointer;transition:transform .08s}
button.fn:active{transform:translateY(2px)}
.fn.start{background:var(--ink);border-color:var(--ink);color:var(--surface);text-align:center;border-radius:999px}
.fn.start small{color:var(--surface);opacity:.8}
.fn.end{background:var(--accent-btn);border-color:var(--accent-btn);color:#fff;text-align:center}
.fn.end small{color:#fff;opacity:.9}
.fn.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.fn.done small{color:var(--ok)}
.fn.done::before{content:"✓ ";font-weight:700}
.fl{height:20px;position:relative}
.fl::before{content:"";position:absolute;left:50%;top:0;bottom:5px;width:3px;margin-left:-1.5px;background:var(--g2)}
.fl::after{content:"";position:absolute;left:50%;bottom:0;margin-left:-7px;border:7px solid transparent;border-top:8px solid var(--g2);border-bottom:0}
.fq{background:var(--accent-soft);border:2px solid var(--accent-btn);border-radius:16px;padding:12px 14px;font-weight:700;text-align:center;color:var(--ink)}
.fq::before{content:"?";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-btn);color:#fff;font:700 14px var(--font-display);margin-right:8px}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fb>div{border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.35}
.fb .si{background:var(--accent-soft);border:2px solid var(--accent-btn)}
.fb .no{background:var(--g1);border:2px solid var(--g2)}
.fb b{display:block;font:600 12px var(--font-display);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.fb .si b{color:var(--accent)}
@media (max-width:340px){.fb{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var nf=function(n,d){if(d===undefined)d=2;return Number.isFinite(n)?n.toLocaleString("es-AR",{maximumFractionDigits:d}):"–"};
var parse=function(s){var t=String(s).trim().replace(",",".");return t===""?NaN:Number(t)};
var norm=function(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")};
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var shuffle=function(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}return b};
var sign=function(n){return (n>0?"+":n<0?"−":"")+nf(Math.abs(n),0)};

/* ---------------- CALCULADORAS ---------------- */
var CALCS=[
{id:"goteo",name:"Goteo de infusión",short:"Goteo",
 intro:"Gotas por minuto y velocidad en ml/h para pasar un volumen en un tiempo dado.",
 fields:[
  {id:"vol",label:"Volumen (ml)",value:"500"},
  {id:"h",label:"Horas",value:"4",optional:true},
  {id:"min",label:"Minutos",value:"0",optional:true},
  {id:"f",label:"Equipo",type:"select",value:20,options:[[20,"Macrogoteo · 20 gotas/ml"],[60,"Microgoteo · 60 microgotas/ml"],[15,"15 gotas/ml"],[10,"10 gotas/ml"]]}
 ],
 compute:function(v){
  var mins=v.h*60+v.min;
  if(!(v.vol>0)||!(mins>0))return null;
  var mlh=v.vol/(mins/60), gm=v.vol*v.f/mins;
  return {
   main:{label:"Goteo",value:nf(Math.round(gm),0),unit:v.f===60?"microgotas/min":"gotas/min"},
   extras:[{label:"Velocidad",value:nf(mlh,1)+" ml/h"},{label:"1 gota cada",value:nf(60/gm,1)+" s"}],
   steps:["gotas/min = (volumen × factor) ÷ minutos","= ("+nf(v.vol)+" × "+v.f+") ÷ "+nf(mins)+" = "+nf(gm,1),"Se redondea a "+nf(Math.round(gm),0)+" por minuto."],
   tip:"Atajo: con macrogoteo (20 gotas/ml) los ml/h ÷ 3 dan las gotas/min. Con microgoteo, los ml/h son iguales a las microgotas/min."
  };
 }},
{id:"dosis",name:"Dosis por peso",short:"Dosis por peso",
 intro:"Convierte una dosis en mg/kg al volumen que hay que preparar.",
 fields:[
  {id:"d",label:"Dosis indicada (mg/kg)",value:"15"},
  {id:"p",label:"Peso (kg)",value:"20"},
  {id:"c",label:"Concentración (mg/ml)",value:"100"}
 ],
 compute:function(v){
  if(!(v.d>0&&v.p>0&&v.c>0))return null;
  var mg=v.d*v.p, ml=mg/v.c;
  return {
   main:{label:"Volumen a administrar",value:nf(ml,2),unit:"ml"},
   extras:[{label:"Dosis total",value:nf(mg,1)+" mg"}],
   steps:["mg totales = dosis × peso","= "+nf(v.d)+" × "+nf(v.p)+" = "+nf(mg,1)+" mg","ml = mg ÷ concentración","= "+nf(mg,1)+" ÷ "+nf(v.c)+" = "+nf(ml,2)+" ml"],
   tip:"Controlá la dosis máxima diaria en el vademécum o en el protocolo antes de administrar."
  };
 }},
{id:"regla",name:"Regla de tres",short:"Regla de 3",
 intro:"Qué volumen tomar de una ampolla o frasco para dar la dosis indicada.",
 fields:[
  {id:"i",label:"Indicado (mg)",value:"250"},
  {id:"a",label:"Presentación (mg)",value:"500"},
  {id:"v",label:"Contenida en (ml)",value:"2"}
 ],
 compute:function(v){
  if(!(v.i>0&&v.a>0&&v.v>0))return null;
  var ml=v.i*v.v/v.a, pct=v.i/v.a*100;
  return {
   main:{label:"Volumen a administrar",value:nf(ml,2),unit:"ml"},
   extras:[{label:"De la presentación",value:nf(pct,0)+" %"}],
   steps:["Si "+nf(v.a)+" mg están en "+nf(v.v)+" ml, "+nf(v.i)+" mg están en X ml","X = (indicado × volumen) ÷ presentación","= ("+nf(v.i)+" × "+nf(v.v)+") ÷ "+nf(v.a)+" = "+nf(ml,2)+" ml"]
  };
 }},
{id:"bomba",name:"Bomba de infusión (mcg/kg/min)",short:"Bomba",
 intro:"Velocidad en ml/h para medicación en infusión continua dosificada por peso.",
 fields:[
  {id:"d",label:"Dosis (mcg/kg/min)",value:"5"},
  {id:"p",label:"Peso (kg)",value:"70"},
  {id:"mg",label:"Droga en la solución (mg)",value:"200"},
  {id:"ml",label:"Volumen total (ml)",value:"250"}
 ],
 compute:function(v){
  if(!(v.d>0&&v.p>0&&v.mg>0&&v.ml>0))return null;
  var conc=v.mg*1000/v.ml, mlh=v.d*v.p*60/conc, mgh=v.d*v.p*60/1000;
  return {
   main:{label:"Velocidad de bomba",value:nf(mlh,1),unit:"ml/h"},
   extras:[{label:"Concentración",value:nf(conc,0)+" mcg/ml"},{label:"Dosis horaria",value:nf(mgh,2)+" mg/h"}],
   msg:"Medicación de alto riesgo: verificá el cálculo con otro profesional.",tone:"warn",
   steps:["Concentración = mg × 1000 ÷ ml = "+nf(v.mg)+" × 1000 ÷ "+nf(v.ml)+" = "+nf(conc,0)+" mcg/ml","ml/h = dosis × peso × 60 ÷ concentración","= "+nf(v.d)+" × "+nf(v.p)+" × 60 ÷ "+nf(conc,0)+" = "+nf(mlh,1)+" ml/h"]
  };
 }},
{id:"conc",name:"Concentración de soluciones",short:"Concentración",
 intro:"Pasa un porcentaje a mg/ml y calcula los gramos que hay en el volumen total.",
 fields:[
  {id:"pct",label:"Concentración (%)",value:"0,9"},
  {id:"vol",label:"Volumen (ml)",value:"500"}
 ],
 compute:function(v){
  if(!(v.pct>0&&v.vol>0))return null;
  var mgml=v.pct*10, g=v.pct*v.vol/100;
  return {
   main:{label:"Concentración",value:nf(mgml,2),unit:"mg/ml"},
   extras:[{label:"En 100 ml",value:nf(v.pct,2)+" g"},{label:"En "+nf(v.vol)+" ml",value:nf(g,2)+" g"}],
   steps:["Un 1 % equivale a 1 g en 100 ml, es decir 10 mg/ml.","mg/ml = % × 10 = "+nf(v.pct)+" × 10 = "+nf(mgml,2),"gramos totales = % × volumen ÷ 100 = "+nf(g,2)+" g"],
   tip:"Ejemplos: suero fisiológico 0,9 % = 9 mg/ml. Dextrosa 5 % = 50 mg/ml."
  };
 }},
{id:"imc",name:"Índice de masa corporal",short:"IMC",
 intro:"Relación entre peso y talla, con la clasificación de la OMS para adultos.",
 fields:[
  {id:"p",label:"Peso (kg)",value:"70"},
  {id:"t",label:"Talla (cm)",value:"170"}
 ],
 compute:function(v){
  if(!(v.p>0&&v.t>0))return null;
  var m=v.t>3?v.t/100:v.t, imc=v.p/(m*m), cat,tone;
  if(imc<18.5){cat="Bajo peso";tone="warn"}
  else if(imc<25){cat="Normopeso";tone="ok"}
  else if(imc<30){cat="Sobrepeso";tone="warn"}
  else if(imc<35){cat="Obesidad grado I";tone="warn"}
  else if(imc<40){cat="Obesidad grado II";tone="warn"}
  else{cat="Obesidad grado III";tone="crit"}
  return {
   main:{label:"IMC",value:nf(imc,1),unit:"kg/m²"},
   msg:cat,tone:tone,
   steps:["IMC = peso ÷ talla² (talla en metros)","= "+nf(v.p)+" ÷ ("+nf(m,2)+")² = "+nf(imc,1),"Rangos: menos de 18,5 bajo peso · 18,5–24,9 normal · 25–29,9 sobrepeso · 30 o más obesidad."]
  };
 }},
{id:"pam",name:"Presión arterial media",short:"PAM",
 intro:"Presión de perfusión promedio a partir de la sistólica y la diastólica.",
 fields:[
  {id:"s",label:"Sistólica (mmHg)",value:"130"},
  {id:"d",label:"Diastólica (mmHg)",value:"80"}
 ],
 compute:function(v){
  if(!(v.s>0&&v.d>0&&v.s>v.d))return null;
  var pam=(v.s+2*v.d)/3, pp=v.s-v.d, msg,tone;
  if(pam<65){msg="PAM menor a 65 mmHg: riesgo de hipoperfusión. Avisar.";tone="crit"}
  else if(pam<70){msg="PAM baja. Controlar y avisar si hay síntomas.";tone="warn"}
  else if(pam<=100){msg="PAM dentro del rango esperable (70–100 mmHg).";tone="ok"}
  else{msg="PAM elevada. Repetir la medición y comunicar.";tone="warn"}
  return {
   main:{label:"PAM",value:nf(pam,0),unit:"mmHg"},
   extras:[{label:"Presión diferencial",value:nf(pp,0)+" mmHg"}],
   msg:msg,tone:tone,
   steps:["PAM = (sistólica + 2 × diastólica) ÷ 3","= ("+nf(v.s)+" + 2 × "+nf(v.d)+") ÷ 3 = "+nf(pam,1)]
  };
 }},
{id:"diuresis",name:"Diuresis horaria",short:"Diuresis",
 intro:"Diuresis por kilo y por hora para detectar oliguria.",
 fields:[
  {id:"v",label:"Volumen (ml)",value:"300"},
  {id:"h",label:"Tiempo (horas)",value:"6"},
  {id:"p",label:"Peso (kg)",value:"70"}
 ],
 compute:function(v){
  if(!(v.v>=0&&v.h>0&&v.p>0)||Number.isNaN(v.v))return null;
  var mlh=v.v/v.h, r=mlh/v.p, msg,tone;
  if(r<0.5){msg="Oliguria (menos de 0,5 ml/kg/h): avisar.";tone="crit"}
  else{msg="Diuresis adecuada (0,5 ml/kg/h o más).";tone="ok"}
  return {
   main:{label:"Diuresis",value:nf(r,2),unit:"ml/kg/h"},
   extras:[{label:"Por hora",value:nf(mlh,0)+" ml/h"}],
   msg:msg,tone:tone,
   steps:["ml/h = volumen ÷ horas = "+nf(v.v)+" ÷ "+nf(v.h)+" = "+nf(mlh,1),"ml/kg/h = ml/h ÷ peso = "+nf(mlh,1)+" ÷ "+nf(v.p)+" = "+nf(r,2)]
  };
 }},
{id:"balance",name:"Balance hídrico",short:"Balance",
 intro:"Ingresos menos egresos en el período evaluado (por lo general 24 horas).",
 fields:[
  {id:"o",label:"Ingreso oral (ml)",value:"1200",optional:true},
  {id:"e",label:"Ingreso parenteral (ml)",value:"1000",optional:true},
  {id:"oi",label:"Otros ingresos (ml)",value:"0",optional:true},
  {id:"u",label:"Diuresis (ml)",value:"1500",optional:true},
  {id:"oe",label:"Drenajes, vómitos, deposiciones (ml)",value:"300",optional:true},
  {id:"pi",label:"Pérdidas insensibles (ml)",value:"500",optional:true}
 ],
 compute:function(v){
  var ing=v.o+v.e+v.oi, egr=v.u+v.oe+v.pi;
  if(!(ing>0||egr>0))return null;
  var b=ing-egr, msg;
  if(b>0)msg="Balance positivo: entra más de lo que sale. Valorar edemas, peso y respiración.";
  else if(b<0)msg="Balance negativo: sale más de lo que entra. Valorar signos de deshidratación.";
  else msg="Balance equilibrado.";
  return {
   main:{label:"Balance",value:sign(b),unit:"ml"},
   extras:[{label:"Ingresos",value:nf(ing,0)+" ml"},{label:"Egresos",value:nf(egr,0)+" ml"}],
   msg:msg,
   steps:["Balance = ingresos − egresos","= "+nf(ing,0)+" − "+nf(egr,0)+" = "+sign(b)+" ml"],
   tip:"Las pérdidas insensibles se estiman en unos 500–800 ml por día en un adulto y aumentan con fiebre. Interpretá el balance junto con la clínica y el peso."
  };
 }},
{id:"glasgow",name:"Escala de coma de Glasgow",short:"Glasgow",
 intro:"Elegí la mejor respuesta del paciente en cada categoría.",
 fields:[
  {id:"e",label:"Apertura ocular",type:"select",value:4,options:[[4,"4 · Espontánea"],[3,"3 · A la voz"],[2,"2 · Al dolor"],[1,"1 · Ninguna"]]},
  {id:"v",label:"Respuesta verbal",type:"select",value:5,options:[[5,"5 · Orientado"],[4,"4 · Confuso"],[3,"3 · Palabras inapropiadas"],[2,"2 · Sonidos incomprensibles"],[1,"1 · Ninguna"]]},
  {id:"m",label:"Respuesta motora",type:"select",value:6,options:[[6,"6 · Obedece órdenes"],[5,"5 · Localiza el dolor"],[4,"4 · Retira ante el dolor"],[3,"3 · Flexión anormal"],[2,"2 · Extensión anormal"],[1,"1 · Ninguna"]]}
 ],
 compute:function(v){
  var t=v.e+v.v+v.m, msg,tone;
  if(t>=13){msg="Compromiso leve (13–15).";tone="ok"}
  else if(t>=9){msg="Compromiso moderado (9–12). Avisar.";tone="warn"}
  else{msg="Compromiso grave (8 o menos). Avisar de inmediato y valorar la vía aérea.";tone="crit"}
  return {
   main:{label:"Glasgow",value:String(t),unit:"/ 15"},
   extras:[{label:"Ocular",value:"O"+v.e},{label:"Verbal",value:"V"+v.v},{label:"Motora",value:"M"+v.m}],
   msg:msg,tone:tone,
   steps:["Total = ocular + verbal + motora","= "+v.e+" + "+v.v+" + "+v.m+" = "+t,"El mínimo posible es 3 y el máximo 15."]
  };
 }},
{id:"ref",name:"Valores de referencia",short:"Referencias",isStatic:true,html:function(){return refHtml()}},

/* ---- Terapia intensiva ---- */
{id:"gas",g:"uci",name:"Gasometría arterial",short:"Gasometría",
 intro:"Identifica el trastorno ácido-base primario a partir de pH, PaCO₂ y bicarbonato.",
 fields:[
  {id:"ph",label:"pH",value:"7,28"},
  {id:"co2",label:"PaCO₂ (mmHg)",value:"28"},
  {id:"hco3",label:"HCO₃⁻ (mEq/L)",value:"13"}
 ],
 compute:function(v){
  if(!(v.ph>6.5&&v.ph<8&&v.co2>0&&v.hco3>0))return null;
  var acid=v.ph<7.35,alk=v.ph>7.45,hi=v.co2>45,lo=v.co2<35,bh=v.hco3>26,bl=v.hco3<22;
  var a="Normal",b="pH en rango",tone="ok",kind="",extras=[],msg;
  if(acid){
    a="Acidosis";tone="warn";
    if(hi&&bl)b="mixta";
    else if(bl){b="metabólica";kind="met"}
    else if(hi)b="respiratoria";
    else b="a revisar";
  }else if(alk){
    a="Alcalosis";tone="warn";
    if(lo&&bh)b="mixta";
    else if(bh)b="metabólica";
    else if(lo)b="respiratoria";
    else b="a revisar";
  }else if((hi&&bh)||(lo&&bl)){b="posible trastorno compensado";tone="warn"}
  else if(hi||lo||bh||bl){b="con algún valor alterado";tone="warn"}
  if(v.ph<7.2||v.ph>7.6)tone="crit";
  msg=tone==="ok"?"Equilibrio ácido-base sin alteraciones.":"Valorá al paciente, buscá la causa y avisá al equipo.";
  if(kind==="met"){
    var ex=1.5*v.hco3+8;
    extras.push({label:"PaCO₂ esperada",value:nf(ex-2,0)+"–"+nf(ex+2,0)+" mmHg"});
    if(v.co2>ex+2)msg="PaCO₂ mayor a la esperada: hay además un componente de acidosis respiratoria.";
    else if(v.co2<ex-2)msg="PaCO₂ menor a la esperada: hay además alcalosis respiratoria.";
    else msg="Compensación respiratoria adecuada.";
  }
  return {
   main:{label:"Trastorno",value:a,unit:b},
   extras:extras,msg:msg,tone:tone,
   steps:["Referencias: pH 7,35–7,45 · PaCO₂ 35–45 mmHg · HCO₃⁻ 22–26 mEq/L","1) pH "+nf(v.ph,2)+": "+(acid?"ácido":alk?"alcalino":"en rango"),"2) PaCO₂ "+nf(v.co2,0)+": "+(hi?"alta":lo?"baja":"normal")+" · HCO₃⁻ "+nf(v.hco3,0)+": "+(bh?"alto":bl?"bajo":"normal"),"3) El componente que explica el sentido del pH es el primario.","Compensación en acidosis metabólica (Winter): PaCO₂ esperada = 1,5 × HCO₃⁻ + 8 ± 2"]
  };
 }},
{id:"pf",g:"uci",name:"Relación PaO₂/FiO₂",short:"PaO₂/FiO₂",
 intro:"Mide qué tan bien oxigena el pulmón según el oxígeno que recibe el paciente.",
 fields:[
  {id:"pao2",label:"PaO₂ (mmHg)",value:"90"},
  {id:"fio2",label:"FiO₂ (%)",value:"40"}
 ],
 compute:function(v){
  var f=v.fio2>1?v.fio2/100:v.fio2;
  if(!(v.pao2>0&&f>=0.21&&f<=1))return null;
  var pf=v.pao2/f,msg,tone;
  if(pf>300){msg="Sin alteración marcada de la oxigenación (más de 300).";tone="ok"}
  else if(pf>200){msg="Rango leve de los criterios de Berlin para SDRA (200–300).";tone="warn"}
  else if(pf>100){msg="Rango moderado (100–200). Avisar.";tone="crit"}
  else{msg="Rango grave (100 o menos). Avisar de inmediato.";tone="crit"}
  return {
   main:{label:"PaO₂/FiO₂",value:nf(pf,0),unit:"mmHg"},
   extras:[{label:"FiO₂",value:nf(f*100,0)+" %"}],
   msg:msg,tone:tone,
   steps:["PaO₂/FiO₂ = PaO₂ ÷ FiO₂ (en fracción)","= "+nf(v.pao2,0)+" ÷ "+nf(f,2)+" = "+nf(pf,0),"Los criterios de Berlin para SDRA además requieren PEEP de 5 cmH₂O o más, infiltrados bilaterales y una causa conocida."]
  };
 }},
{id:"aa",g:"uci",name:"Gradiente alvéolo-arterial de O₂",short:"Gradiente A-a",
 intro:"Diferencia entre el oxígeno alveolar calculado y el medido en sangre arterial. Se asume nivel del mar (760 mmHg).",
 fields:[
  {id:"fio2",label:"FiO₂ (%)",value:"21"},
  {id:"pao2",label:"PaO₂ (mmHg)",value:"90"},
  {id:"paco2",label:"PaCO₂ (mmHg)",value:"40"},
  {id:"edad",label:"Edad (años)",value:"40"}
 ],
 compute:function(v){
  var f=v.fio2>1?v.fio2/100:v.fio2;
  if(!(f>=0.21&&f<=1&&v.pao2>0&&v.paco2>0&&v.edad>0))return null;
  var pA=f*(760-47)-v.paco2/0.8, aa=pA-v.pao2, exp=v.edad/4+4, msg,tone;
  if(f>0.215){msg="Con FiO₂ mayor a 21 % el gradiente normal es más alto. Interpretalo con cautela.";tone=""}
  else if(aa<=exp){msg="Gradiente dentro de lo esperable para la edad.";tone="ok"}
  else{msg="Gradiente elevado: sugiere shunt, alteración V/Q o de difusión.";tone="warn"}
  return {
   main:{label:"Gradiente A-a",value:nf(aa,0),unit:"mmHg"},
   extras:[{label:"PAO₂ alveolar",value:nf(pA,0)+" mmHg"},{label:"Esperado (aire ambiente)",value:"hasta "+nf(exp,0)+" mmHg"}],
   msg:msg,tone:tone,
   steps:["PAO₂ = FiO₂ × (760 − 47) − PaCO₂ ÷ 0,8","= "+nf(f,2)+" × 713 − "+nf(v.paco2,0)+" ÷ 0,8 = "+nf(pA,0),"A-a = PAO₂ − PaO₂ = "+nf(pA,0)+" − "+nf(v.pao2,0)+" = "+nf(aa,0),"Esperado respirando aire ambiente: edad ÷ 4 + 4 = "+nf(exp,0)]
  };
 }},
{id:"ag",g:"uci",name:"Brecha aniónica",short:"Brecha aniónica",
 intro:"Ayuda a orientar la causa de una acidosis metabólica. La albúmina es opcional.",
 fields:[
  {id:"na",label:"Sodio (mEq/L)",value:"140"},
  {id:"cl",label:"Cloro (mEq/L)",value:"104"},
  {id:"hco3",label:"HCO₃⁻ (mEq/L)",value:"24"},
  {id:"alb",label:"Albúmina (g/dl)",value:"",optional:true}
 ],
 compute:function(v){
  if(!(v.na>0&&v.cl>0&&v.hco3>0))return null;
  var ag=v.na-v.cl-v.hco3, hasAlb=v.alb>0, corr=hasAlb?ag+2.5*(4-v.alb):ag, msg,tone;
  if(corr>12){msg="Brecha elevada: pensar en cetoacidosis, acidosis láctica, uremia o tóxicos.";tone="warn"}
  else if(corr<8){msg="Brecha baja: verificar la albúmina y los datos de laboratorio.";tone="warn"}
  else{msg="Brecha normal (8–12 mEq/L).";tone="ok"}
  var ex=hasAlb?[{label:"Corregida por albúmina",value:nf(corr,1)+" mEq/L"}]:[];
  return {
   main:{label:"Brecha aniónica",value:nf(ag,0),unit:"mEq/L"},
   extras:ex,msg:msg,tone:tone,
   steps:["Brecha = Na − (Cl + HCO₃⁻)","= "+nf(v.na,0)+" − ("+nf(v.cl,0)+" + "+nf(v.hco3,0)+") = "+nf(ag,0)].concat(hasAlb?["Corregida = brecha + 2,5 × (4 − albúmina) = "+nf(corr,1)]:[])
  };
 }},
{id:"osm",g:"uci",name:"Osmolaridad plasmática",short:"Osmolaridad",
 intro:"Osmolaridad calculada a partir de sodio, glucosa y urea.",
 fields:[
  {id:"na",label:"Sodio (mEq/L)",value:"140"},
  {id:"glu",label:"Glucemia (mg/dl)",value:"90"},
  {id:"ur",label:"Urea (mg/dl)",value:"30"}
 ],
 compute:function(v){
  if(!(v.na>0&&v.glu>0&&v.ur>0))return null;
  var o=2*v.na+v.glu/18+v.ur/6, msg,tone;
  if(o>295){msg="Hiperosmolaridad (más de 295 mOsm/L).";tone="warn"}
  else if(o<275){msg="Hipoosmolaridad (menos de 275 mOsm/L).";tone="warn"}
  else{msg="Dentro del rango normal (275–295 mOsm/L).";tone="ok"}
  return {
   main:{label:"Osmolaridad",value:nf(o,0),unit:"mOsm/L"},
   msg:msg,tone:tone,
   steps:["Osm = 2 × Na + glucemia ÷ 18 + urea ÷ 6","= 2 × "+nf(v.na,0)+" + "+nf(v.glu,0)+" ÷ 18 + "+nf(v.ur,0)+" ÷ 6 = "+nf(o,0),"Si el laboratorio informa nitrógeno ureico (BUN), se divide por 2,8."]
  };
 }},
{id:"vt",g:"uci",name:"Peso ideal y volumen corriente",short:"Peso ideal / Vt",
 intro:"Peso ideal según talla y sexo, y volumen corriente para ventilación protectora.",
 fields:[
  {id:"s",label:"Sexo",type:"select",value:1,options:[[1,"Masculino"],[0,"Femenino"]]},
  {id:"t",label:"Talla (cm)",value:"170"}
 ],
 compute:function(v){
  if(!(v.t>120&&v.t<230))return null;
  var pi=(v.s===1?50:45.5)+0.91*(v.t-152.4);
  return {
   main:{label:"Volumen corriente a 6 ml/kg",value:nf(6*pi,0),unit:"ml"},
   extras:[{label:"Peso ideal",value:nf(pi,1)+" kg"},{label:"Rango 4–8 ml/kg",value:nf(4*pi,0)+"–"+nf(8*pi,0)+" ml"}],
   msg:"Meta habitual: 6 ml/kg de peso ideal con presión meseta de 30 cmH₂O o menos.",
   steps:["Peso ideal "+(v.s===1?"(hombre) = 50":"(mujer) = 45,5")+" + 0,91 × (talla − 152,4)","= "+(v.s===1?"50":"45,5")+" + 0,91 × ("+nf(v.t,0)+" − 152,4) = "+nf(pi,1)+" kg","Vt = 6 × "+nf(pi,1)+" = "+nf(6*pi,0)+" ml"],
   tip:"Se usa el peso ideal y no el peso real: el tamaño de los pulmones depende de la talla."
  };
 }},
{id:"mec",g:"uci",name:"Mecánica ventilatoria",short:"Driving pressure",
 intro:"Driving pressure y distensibilidad estática con el paciente en ventilación controlada.",
 fields:[
  {id:"vt",label:"Volumen corriente (ml)",value:"420"},
  {id:"pp",label:"Presión meseta (cmH₂O)",value:"22"},
  {id:"peep",label:"PEEP (cmH₂O)",value:"8",optional:true}
 ],
 compute:function(v){
  if(!(v.vt>0&&v.pp>0&&v.pp>v.peep))return null;
  var dp=v.pp-v.peep, c=v.vt/dp, msg,tone;
  if(v.pp>30){msg="Presión meseta mayor a 30 cmH₂O: avisar.";tone="crit"}
  else if(dp>15){msg="Driving pressure mayor a 15 cmH₂O: avisar.";tone="warn"}
  else{msg="Presión meseta y driving pressure dentro de las metas habituales.";tone="ok"}
  return {
   main:{label:"Driving pressure",value:nf(dp,0),unit:"cmH₂O"},
   extras:[{label:"Distensibilidad estática",value:nf(c,0)+" ml/cmH₂O"}],
   msg:msg,tone:tone,
   steps:["Driving pressure = presión meseta − PEEP","= "+nf(v.pp,0)+" − "+nf(v.peep,0)+" = "+nf(dp,0),"Distensibilidad = Vt ÷ driving pressure = "+nf(v.vt,0)+" ÷ "+nf(dp,0)+" = "+nf(c,1)],
   tip:"Metas habituales: presión meseta de 30 o menos y driving pressure de 15 o menos. La presión meseta se mide con una pausa inspiratoria y el paciente sin esfuerzo."
  };
 }},
{id:"gc",g:"uci",name:"Gasto e índice cardíaco",short:"Gasto cardíaco",
 intro:"Gasto cardíaco a partir de frecuencia y volumen sistólico, e índice según la superficie corporal.",
 fields:[
  {id:"fc",label:"Frecuencia cardíaca (lpm)",value:"80"},
  {id:"vs",label:"Volumen sistólico (ml)",value:"70"},
  {id:"p",label:"Peso (kg)",value:"70"},
  {id:"t",label:"Talla (cm)",value:"170"}
 ],
 compute:function(v){
  if(!(v.fc>0&&v.vs>0&&v.p>0&&v.t>0))return null;
  var gc=v.fc*v.vs/1000, sc=Math.sqrt(v.p*v.t/3600), ic=gc/sc, msg,tone;
  if(ic<2.2){msg="Índice cardíaco bajo: avisar.";tone="crit"}
  else if(ic<2.5){msg="Índice cardíaco en el límite inferior.";tone="warn"}
  else if(ic<=4){msg="Índice cardíaco dentro del rango (2,5–4,0 L/min/m²).";tone="ok"}
  else{msg="Índice cardíaco alto.";tone="warn"}
  return {
   main:{label:"Gasto cardíaco",value:nf(gc,1),unit:"L/min"},
   extras:[{label:"Índice cardíaco",value:nf(ic,2)+" L/min/m²"},{label:"Superficie corporal",value:nf(sc,2)+" m²"}],
   msg:msg,tone:tone,
   steps:["GC = FC × volumen sistólico ÷ 1000 = "+nf(v.fc,0)+" × "+nf(v.vs,0)+" ÷ 1000 = "+nf(gc,1),"Superficie corporal (Mosteller) = √(peso × talla ÷ 3600) = "+nf(sc,2),"Índice cardíaco = GC ÷ superficie = "+nf(ic,2)]
  };
 }},
{id:"rvs",g:"uci",name:"Resistencia vascular sistémica",short:"RVS",
 intro:"Resistencia que opone la circulación sistémica. Útil para diferenciar tipos de shock.",
 fields:[
  {id:"pam",label:"PAM (mmHg)",value:"80"},
  {id:"pvc",label:"PVC (mmHg)",value:"8"},
  {id:"gc",label:"Gasto cardíaco (L/min)",value:"5,6"}
 ],
 compute:function(v){
  if(!(v.pam>0&&v.pvc>=0&&v.gc>0&&v.pam>v.pvc))return null;
  var r=80*(v.pam-v.pvc)/v.gc, msg,tone;
  if(r<800){msg="RVS baja: vasodilatación (sepsis, anafilaxia, neurogénico).";tone="warn"}
  else if(r>1200){msg="RVS alta: vasoconstricción (shock cardiogénico o hipovolémico).";tone="warn"}
  else{msg="RVS dentro del rango (800–1200).";tone="ok"}
  return {
   main:{label:"RVS",value:nf(r,0),unit:"dyn·s/cm⁵"},
   msg:msg,tone:tone,
   steps:["RVS = 80 × (PAM − PVC) ÷ gasto cardíaco","= 80 × ("+nf(v.pam,0)+" − "+nf(v.pvc,0)+") ÷ "+nf(v.gc,1)+" = "+nf(r,0)]
  };
 }},
{id:"ppc",g:"uci",name:"Presión de perfusión cerebral",short:"PPC",
 intro:"Presión que impulsa la sangre hacia el cerebro, a partir de la PAM y la presión intracraneal.",
 fields:[
  {id:"pam",label:"PAM (mmHg)",value:"80"},
  {id:"pic",label:"PIC (mmHg)",value:"15"}
 ],
 compute:function(v){
  if(!(v.pam>0&&v.pic>=0))return null;
  var ppc=v.pam-v.pic, msg,tone;
  if(ppc<60){msg="PPC menor a 60 mmHg: riesgo de isquemia cerebral. Avisar.";tone="crit"}
  else if(ppc<=70){msg="PPC dentro del objetivo habitual (60–70 mmHg).";tone="ok"}
  else{msg="PPC por encima del objetivo habitual (60–70 mmHg).";tone="warn"}
  if(v.pic>22)msg+=" Presión intracraneal elevada (más de 22 mmHg): avisar.";
  return {
   main:{label:"PPC",value:nf(ppc,0),unit:"mmHg"},
   msg:msg,tone:tone,
   steps:["PPC = PAM − PIC","= "+nf(v.pam,0)+" − "+nf(v.pic,0)+" = "+nf(ppc,0)],
   tip:"El objetivo exacto lo indica el equipo médico según el cuadro de cada paciente."
  };
 }},
{id:"si",g:"uci",name:"Índice de shock",short:"Índice de shock",
 intro:"Frecuencia cardíaca dividida por presión sistólica. Detecta inestabilidad antes que la presión sola.",
 fields:[
  {id:"fc",label:"Frecuencia cardíaca (lpm)",value:"80"},
  {id:"pas",label:"Sistólica (mmHg)",value:"120"}
 ],
 compute:function(v){
  if(!(v.fc>0&&v.pas>0))return null;
  var si=v.fc/v.pas, msg,tone;
  if(si>=0.9){msg="Índice alto: sugiere inestabilidad hemodinámica. Avisar.";tone="crit"}
  else if(si>=0.7){msg="Índice elevado: vigilar de cerca y repetir controles.";tone="warn"}
  else{msg="Índice normal (0,5–0,7).";tone="ok"}
  return {
   main:{label:"Índice de shock",value:nf(si,2),unit:"lpm/mmHg"},
   msg:msg,tone:tone,
   steps:["Índice de shock = FC ÷ presión sistólica","= "+nf(v.fc,0)+" ÷ "+nf(v.pas,0)+" = "+nf(si,2)]
  };
 }},
{id:"qsofa",g:"uci",name:"qSOFA",short:"qSOFA",
 intro:"Tamizaje rápido de riesgo de mala evolución en un paciente con sospecha de infección.",
 fields:[
  {id:"fr",label:"Frecuencia respiratoria",type:"select",value:0,options:[[0,"Menos de 22 rpm"],[1,"22 rpm o más"]]},
  {id:"m",label:"Estado mental",type:"select",value:0,options:[[0,"Alerta (Glasgow 15)"],[1,"Alterado (Glasgow menor a 15)"]]},
  {id:"pas",label:"Presión sistólica",type:"select",value:0,options:[[0,"Más de 100 mmHg"],[1,"100 mmHg o menos"]]}
 ],
 compute:function(v){
  var t=v.fr+v.m+v.pas, msg,tone;
  if(t>=2){msg="Riesgo elevado de mala evolución. Avisar y activar el protocolo de sepsis.";tone="crit"}
  else if(t===1){msg="Un solo criterio no descarta sepsis. Seguir vigilando.";tone="warn"}
  else{msg="Ningún criterio. Igual valorá la clínica del paciente.";tone="ok"}
  return {
   main:{label:"qSOFA",value:String(t),unit:"/ 3"},
   msg:msg,tone:tone,
   steps:["Se suma 1 punto por cada criterio presente.","= "+v.fr+" + "+v.m+" + "+v.pas+" = "+t,"Con 2 o más puntos aumenta el riesgo."],
   tip:"Es una herramienta de alerta, no un diagnóstico. No reemplaza el criterio clínico ni el protocolo de tu institución."
  };
 }},
{id:"cg",g:"uci",name:"Clearance de creatinina (Cockcroft-Gault)",short:"Clearance Cr",
 intro:"Estimación de la función renal para ajustar la dosis de fármacos.",
 fields:[
  {id:"s",label:"Sexo",type:"select",value:1,options:[[1,"Masculino"],[0,"Femenino"]]},
  {id:"e",label:"Edad (años)",value:"60"},
  {id:"p",label:"Peso (kg)",value:"70"},
  {id:"cr",label:"Creatinina (mg/dl)",value:"1"}
 ],
 compute:function(v){
  if(!(v.e>0&&v.p>0&&v.cr>0))return null;
  var cl=(140-v.e)*v.p/(72*v.cr)*(v.s===1?1:0.85), msg,tone;
  if(cl<=0)return null;
  if(cl>=90){msg="Función renal normal.";tone="ok"}
  else if(cl>=60){msg="Disminución leve.";tone="ok"}
  else if(cl>=30){msg="Disminución moderada: revisar dosis de fármacos.";tone="warn"}
  else if(cl>=15){msg="Disminución severa: revisar dosis con el equipo.";tone="crit"}
  else{msg="Falla renal. Avisar.";tone="crit"}
  return {
   main:{label:"Clearance estimado",value:nf(cl,0),unit:"ml/min"},
   msg:msg,tone:tone,
   steps:["(140 − edad) × peso ÷ (72 × creatinina)"+(v.s===1?"":" × 0,85 (mujer)"),"= (140 − "+nf(v.e,0)+") × "+nf(v.p,0)+" ÷ (72 × "+nf(v.cr,2)+")"+(v.s===1?"":" × 0,85")+" = "+nf(cl,0)],
   tip:"No es confiable si la creatinina está cambiando rápido (injuria renal aguda). Usalo como orientación."
  };
 }},
{id:"parkland",g:"uci",name:"Quemaduras: fórmula de Parkland",short:"Parkland",
 intro:"Líquidos de reanimación del adulto con quemaduras de segundo y tercer grado.",
 fields:[
  {id:"p",label:"Peso (kg)",value:"70"},
  {id:"s",label:"Superficie quemada (%)",value:"20"}
 ],
 compute:function(v){
  if(!(v.p>0&&v.s>0&&v.s<=100))return null;
  var tot=4*v.p*v.s, h8=tot/2/8, h16=tot/2/16;
  return {
   main:{label:"Total en 24 horas",value:nf(tot,0),unit:"ml"},
   extras:[{label:"Primeras 8 h",value:nf(h8,0)+" ml/h"},{label:"Siguientes 16 h",value:nf(h16,0)+" ml/h"}],
   msg:"Fórmula orientativa con Ringer lactato. Se ajusta según la diuresis y la indicación médica.",
   steps:["Total = 4 ml × peso × % de superficie quemada","= 4 × "+nf(v.p,0)+" × "+nf(v.s,0)+" = "+nf(tot,0)+" ml","La mitad ("+nf(tot/2,0)+" ml) en las primeras 8 horas y la otra mitad en las 16 siguientes."],
   tip:"Las 8 horas se cuentan desde el momento de la quemadura, no desde la llegada al hospital. Objetivo de diuresis: 0,5 ml/kg/h."
  };
 }},
{id:"refuci",g:"uci",name:"Valores de referencia en UCI",short:"Referencias",isStatic:true,html:function(){return refUciHtml()}},

/* ---- ECG ---- */
{id:"ecgfc",g:"ecg",name:"Frecuencia cardíaca en el ECG",short:"Frecuencia",
 intro:"Ritmo regular: contá los cuadrados grandes entre dos R. Ritmo irregular: contá los QRS en una tira de 6 segundos.",
 fields:[
  {id:"g",label:"Cuadrados grandes entre dos R",value:"4",optional:true},
  {id:"q",label:"QRS en 6 segundos (30 cuadrados grandes)",value:"",optional:true}
 ],
 compute:function(v){
  var fc,steps,msg,tone;
  if(v.g>0){
   fc=300/v.g;
   steps=["Regla de 300 (solo ritmo regular): FC = 300 ÷ cuadrados grandes","= 300 ÷ "+nf(v.g,1)+" = "+nf(fc,0)+" lpm","Con 1, 2, 3, 4, 5 y 6 cuadrados la frecuencia es 300, 150, 100, 75, 60 y 50 lpm."];
  }else if(v.q>0){
   fc=v.q*10;
   steps=["Ritmo irregular: FC = QRS en 6 segundos × 10","= "+nf(v.q,0)+" × 10 = "+nf(fc,0)+" lpm","6 segundos son 30 cuadrados grandes."];
  }else return null;
  if(fc<60){msg="Frecuencia baja (menos de 60 lpm): bradicardia.";tone="warn"}
  else if(fc>100){msg="Frecuencia alta (más de 100 lpm): taquicardia.";tone="warn"}
  else{msg="Frecuencia dentro del rango (60–100 lpm).";tone="ok"}
  return {main:{label:"Frecuencia",value:nf(fc,0),unit:"lpm"},msg:msg,tone:tone,steps:steps,tip:"Si completás los dos datos, se usa el de los cuadrados grandes. En ritmos irregulares como la fibrilación auricular, usá siempre el método de 6 segundos."};
 }},
{id:"ecgqtc",g:"ecg",name:"QT corregido (QTc)",short:"QTc",
 intro:"Corrige el intervalo QT por la frecuencia cardíaca.",
 fields:[
  {id:"s",label:"Sexo",type:"select",value:1,options:[[1,"Masculino"],[0,"Femenino"]]},
  {id:"qt",label:"QT medido (ms)",value:"400"},
  {id:"fc",label:"Frecuencia cardíaca (lpm)",value:"75"}
 ],
 compute:function(v){

function renderOut(r){

  var out="<div class=\"monitor\" role=\"status\"><div class=\"lbl\">"+r.main.label+"</div><div class=\"read\"><span class=\"val\">"+r.main.value+"</span><span class=\"unit\">"+r.main.unit+"</span></div>"+ex+"</div>";
  if(r.msg)out+="<p class=\"verdict "+(r.tone||"")+"\">"+r.msg+"</p>";

function mountCalc(){
  var c=CALCS.filter(function(x){return x.id===calcId})[0], box=$("#calc");
  if(c.isStatic){box.innerHTML=c.html();box.oninput=null;box.onchange=null;return}
  var fields=c.fields.map(function(f){
    var id=c.id+"-"+f.id;
    if(f.type==="select"){
      return "<div class=\"field\"><label for=\""+id+"\">"+f.label+"</label><select id=\""+id+"\">"+f.options.map(function(o){return "<option value=\""+o[0]+"\""+(String(o[0])===String(f.value)?" selected":"")+">"+esc(o[1])+"</option>"}).join("")+"</select></div>";
    }
    return "<div class=\"field\"><label for=\""+id+"\">"+f.label+"</label><input id=\""+id+"\" type=\"text\" inputmode=\"decimal\" autocomplete=\"off\" value=\""+esc(f.value)+"\"></div>";
  }).join("");
  box.innerHTML="<section class=\"card\"><h2>"+c.name+"</h2><p class=\"lead\">"+c.intro+"</p><div class=\"fields\">"+fields+"</div></section><div class=\"out\"></div>";
  var upd=function(){
    var v={};
    c.fields.forEach(function(f){
      var el=document.getElementById(c.id+"-"+f.id);
      var x=f.type==="select"?Number(el.value):parse(el.value);
      if(f.optional&&Number.isNaN(x))x=0;
      v[f.id]=x;
    });
    $(".out",box).innerHTML=renderOut(c.compute(v));
  };
  box.oninput=upd;box.onchange=upd;upd();
}
function viewCalc(root){
  var c0=CALCS.filter(function(c){return c.id===calcId})[0];
  if(!c0){c0=CALCS[0];calcId=c0.id}
  calcGroup=c0.g||"gen";
  root.innerHTML="<div class=\"chips groups\" id=\"grp\" role=\"group\" aria-label=\"Tipo de cálculo\"></div><div class=\"chips\" id=\"cl\" role=\"group\" aria-label=\"Calculadoras\"></div><div id=\"calc\"></div>";
  var drawChips=function(){
    $("#grp",root).innerHTML=GROUPS.map(function(g){return "<button type=\"button\" class=\"chip\" data-g=\""+g[0]+"\" aria-pressed=\""+(g[0]===calcGroup)+"\">"+g[1]+"</button>"}).join("");
    $("#cl",root).innerHTML=CALCS.filter(function(c){return (c.g||"gen")===calcGroup}).map(function(c){return "<button type=\"button\" class=\"chip\" data-id=\""+c.id+"\" aria-pressed=\""+(c.id===calcId)+"\">"+c.short+"</button>"}).join("");
  };
  $("#grp",root).addEventListener("click",function(e){
    var b=e.target.closest(".chip");if(!b||b.dataset.g===calcGroup)return;
    calcGroup=b.dataset.g;
    calcId=CALCS.filter(function(c){return (c.g||"gen")===calcGroup})[0].id;
    store.set("calc",calcId);drawChips();mountCalc();
  });
  $("#cl",root).addEventListener("click",function(e){
    var b=e.target.closest(".chip");if(!b)return;
    calcId=b.dataset.id;store.set("calc",calcId);drawChips();mountCalc();
  });
  drawChips();mountCalc();
}

var patSys="Todas",patQ="";
function patList(){
  var q=norm(patQ);
  var items=PATS.filter(function(p){return (patSys==="Todas"||p.s===patSys)&&(!q||norm(p.n+" "+p.s+" "+p.r).indexOf(q)>-1)});
  if(!items.length)return "<p class=\"empty\">No se encontraron patologías con esa búsqueda.</p>";
  var ul=function(a){return "<ul>"+a.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+"</ul>"};
  return items.map(function(p){
    return "<details class=\"acc\"><summary>"+sysIcon(p.s)+"<span><span class=\"acc-name\">"+esc(p.n)+"</span><br><span class=\"tag\">"+esc(p.s)+"</span></span></summary><div class=\"acc-body\"><p>"+esc(p.r)+"</p><h3 class=\"sec\">Qué se observa</h3>"+ul(p.sig)+"<h3 class=\"sec\">Cuidados de enfermería</h3>"+ul(p.cui)+"<div class=\"alarm\"><h3 class=\"sec\">Avisar de inmediato</h3>"+ul(p.ala)+"</div><p class=\"key\">"+esc(p.key)+"</p></div></details>";
  }).join("");
}
function viewPat(root){
  var systems=["Todas"].concat(PATS.map(function(p){return p.s}).filter(function(s,i,a){return a.indexOf(s)===i}));
  root.innerHTML="<div class=\"searchbox\"><input id=\"pat-q\" type=\"search\" placeholder=\"Buscar patología\" aria-label=\"Buscar patología\" autocomplete=\"off\" value=\""+esc(patQ)+"\"></div><div class=\"chips\" role=\"group\" aria-label=\"Sistema\">"+systems.map(function(s){return "<button type=\"button\" class=\"chip\" data-s=\""+esc(s)+"\" aria-pressed=\""+(s===patSys)+"\">"+esc(s)+"</button>"}).join("")+"</div><div id=\"pat-list\"></div>";
  var draw=function(){$("#pat-list",root).innerHTML=patList()};
  $("#pat-q",root).addEventListener("input",function(e){patQ=e.target.value;draw()});
  $(".chips",root).addEventListener("click",function(e){
    var b=e.target.closest(".chip");if(!b)return;
    patSys=b.dataset.s;
    $$(".chip",root).forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});
    draw();
  });
  draw();
}

var PROCS=[
{n:"Higiene de manos",tag:"Básico",d:"Con agua y jabón durante 40–60 segundos, o con fricción de alcohol en gel durante 20–30 segundos.",
 steps:["Retirá anillos, reloj y pulseras. Uñas cortas y sin esmalte.","Mojá las manos y aplicá jabón líquido suficiente para cubrir toda la superficie.","Frotá las palmas entre sí.","Palma derecha sobre el dorso izquierdo con los dedos entrelazados, y viceversa.","Palma con palma, con los dedos entrelazados.","Dorso de los dedos contra la palma opuesta, con los dedos trabados.","Pulgar izquierdo dentro de la palma derecha con movimiento de rotación, y viceversa.","Yemas de los dedos contra la palma opuesta con movimiento de rotación.","Enjuagá con abundante agua.","Secá con toalla descartable y cerrá la canilla con esa misma toalla."],

{n:"Toma de signos vitales",tag:"Valoración",d:"Temperatura, pulso, respiración, presión arterial y saturación en un paciente en reposo.",

{n:"Glucemia capilar",tag:"Valoración",d:"Medición de glucosa en una gota de sangre del pulpejo del dedo.",

{n:"Administración de medicación",tag:"Seguridad",d:"Los 10 correctos, un chequeo antes de cada dosis. El listado puede variar según la institución.",
 steps:["Paciente correcto: preguntá su nombre completo y verificá con pulsera o documento. Consultá alergias.","Medicamento correcto: compará el rótulo con la indicación al sacarlo, al prepararlo y antes de administrarlo.","Dosis correcta: revisá el cálculo. En medicación de alto riesgo, pedí doble control.","Vía correcta.","Hora correcta.","Registro correcto: anotá después de administrar, nunca antes.","Información al paciente: explicá para qué es y qué efectos puede notar.","Indicación correcta: que corresponda a la situación clínica. Ante una duda, consultá.","Forma y vencimiento: revisá la presentación, el aspecto y la fecha de caducidad.","Respuesta y derecho a rechazar: vigilá el efecto y las reacciones. Si el paciente se niega, registrá y comunicá."],

{n:"Inyección intramuscular",tag:"Técnica",d:"Ventroglútea, vasto externo o deltoides. En adultos, el deltoides admite hasta 2 ml y los otros sitios hasta 5 ml.",
 steps:["Verificá la indicación, los correctos y las alergias.","Higiene de manos y material: jeringa y aguja según el sitio y el paciente, medicación, antiséptico, gasa, guantes y descartador.","Elegí el sitio. La zona ventroglútea es la preferida en adultos.","Acomodá al paciente y relajá el músculo. Descubrí la zona.","Colocate guantes y desinfectá con movimiento circular de adentro hacia afuera. Dejá secar.","Tensá la piel e insertá la aguja a 90° con un movimiento firme y rápido.","Aspirá solo si el protocolo de tu institución lo indica.","Inyectá lento y constante.","Esperá unos segundos, retirá en el mismo ángulo y presioná con gasa.","Descartá la aguja sin reencapuchar en el descartador de cortopunzantes.","Registrá el sitio y la hora, y vigilá la reacción."],

{n:"Inyección subcutánea",tag:"Técnica",d:"Para insulina, heparinas y otros fármacos de absorción lenta.",
 steps:["Verificá la indicación y las alergias. Higiene de manos y guantes.","Elegí el sitio: abdomen (a más de 5 cm del ombligo), cara externa del brazo o muslo. Rotá los sitios.","Desinfectá y dejá secar.","Con aguja de 4–6 mm (insulina) se inserta a 90°. Con otras agujas, formá un pliegue e insertá a 45°.","Inyectá lentamente.","Esperá unos segundos (en insulina, 5–10) antes de retirar.","Con heparinas no masajees ni aspires.","Descartá en el descartador y registrá."],

{n:"Vía venosa periférica",tag:"Técnica",d:"Colocación de un catéter corto en una vena del antebrazo o del dorso de la mano.",
 steps:["Verificá la indicación e identificá al paciente. Explicá el procedimiento y hacé higiene de manos.","Preparalo todo: catéter del calibre adecuado, torniquete, antiséptico, gasas, apósito transparente, extensión y solución.","Elegí la vena en antebrazo o dorso de la mano. Evitá articulaciones y el brazo con fístula, mastectomía o linfedema.","Colocá el torniquete 10–15 cm por encima del sitio, sin dejarlo mucho tiempo.","Colocate guantes y hacé la antisepsia según el protocolo. Dejá secar sin volver a tocar.","Traccioná la piel e insertá con el bisel hacia arriba, a 15–30°.","Cuando veas el retorno de sangre, bajá el ángulo y avanzá un poco el catéter.","Retirá el mandril mientras avanzás el catéter. Presioná sobre la vena para evitar el sangrado y activá la seguridad.","Soltá el torniquete, conectá la extensión y permeabilizá con solución fisiológica.","Fijá con apósito transparente. Rotulá con fecha, hora, calibre y tu nombre.","Descartá el material, registrá y vigilá signos de flebitis o infiltración."],

{n:"RCP básica en adultos",tag:"Emergencia",d:"Soporte vital básico para una persona que no responde y no respira con normalidad.",
 steps:["Verificá que la escena sea segura.","Comprobá la respuesta (tocá los hombros y llamá) y la respiración durante no más de 10 segundos.","Si no responde y no respira o solo jadea, pedí ayuda, activá el sistema de emergencias y pedí un DEA.","Iniciá las compresiones en el centro del pecho, con el talón de la mano y los brazos rectos.","Comprimí 100–120 veces por minuto, a 5–6 cm de profundidad, dejando que el pecho vuelva a su posición.","Alterná 30 compresiones con 2 ventilaciones si estás entrenado.","Colocá el DEA en cuanto llegue y seguí sus indicaciones. Interrumpí lo menos posible.","Cambiá de reanimador cada 2 minutos.","Continuá hasta que llegue ayuda, haya signos de vida o no puedas seguir."],

{n:"Colocación y retiro de EPP",tag:"Seguridad",d:"Equipo de protección personal para precauciones de contacto, gotas o aire. El orden de retiro puede variar según el protocolo de tu institución.",
 steps:["Higiene de manos.","Colocá el camisolín y atalo en el cuello y en la cintura.","Colocá el barbijo quirúrgico o el respirador N95 y ajustá el clip nasal. Con N95, verificá el sellado.","Colocá la protección ocular o facial.","Colocá los guantes y cubrí con ellos los puños del camisolín.","Para retirar: sacate los guantes con la técnica de pellizcar el borde y dar vuelta, sin tocar la piel.","Retirá la protección ocular tomándola de la banda o las patillas.","Retirá el camisolín desde el cuello, dándolo vuelta hacia adentro, y descartalo.","Retirá el barbijo o respirador desde las tiras, sin tocar la parte frontal.","Higiene de manos inmediatamente después."],

{n:"Sondaje vesical",tag:"Técnica",d:"Colocación de una sonda en la vejiga con técnica estéril. Debe tener indicación y retirarse apenas deje de ser necesaria.",
 steps:["Verificá la indicación, explicá el procedimiento y asegurá la privacidad.","Higiene de manos y preparación del material estéril: sonda del calibre adecuado, lubricante, jeringa con agua destilada, bolsa colectora, antiséptico y campo.","Colocá al paciente en posición adecuada (mujer: decúbito dorsal con rodillas flexionadas; varón: decúbito dorsal).","Realizá la higiene genital. Colocate guantes estériles y armá el campo estéril.","Lubricá la sonda. Mujer: separá los labios e identificá el meato por encima de la vagina. Varón: sostené el pene hacia arriba, perpendicular al cuerpo.","Introducí la sonda con suavidad hasta que salga orina (mujer: unos 5–7 cm; varón: hasta cerca de la bifurcación).","Avanzá 2–3 cm más e inflá el balón con el volumen de agua destilada indicado en la sonda, solo con la orina fluyendo.","Si encontrás resistencia, no fuerces: frená y avisá.","Conectá la bolsa en circuito cerrado, fijá la sonda al muslo o al abdomen y dejá la bolsa por debajo de la vejiga, sin apoyar en el piso.","En el varón, reposicioná el prepucio.","Registrá fecha, hora, calibre, volumen y características de la orina."],

function procHtml(p,i){
  var ul=function(a){return "<ul>"+a.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+"</ul>"};
  return "<details class=\"acc"+(store.get("pdone",[]).indexOf(p.n)>-1?" is-done":"")+"\" data-p=\""+i+"\"><summary>"+procThumb(p.n)+"<span><span class=\"acc-name\">"+esc(p.n)+"</span><br><span class=\"tag\">"+esc(p.tag)+"</span></span></summary><div class=\"acc-body\">"+procArt(p.n)+"<p>"+esc(p.d)+"</p><div class=\"prog\"><span class=\"cnt\">0 de "+p.steps.length+"</span><span class=\"bar\"><i></i></span></div><div class=\"steps\">"+p.steps.map(function(s,k){return "<button type=\"button\" class=\"step\" aria-pressed=\"false\"><span class=\"n\" data-n=\""+(k+1)+"\"></span><span class=\"t\">"+esc(s)+"</span></button>"}).join("")+"</div><div class=\"row\"><button type=\"button\" class=\"btn ghost reset\">Reiniciar pasos</button></div><p class=\"key\">"+esc(p.key)+"</p><h3 class=\"sec\">Errores frecuentes</h3>"+ul(p.err)+"</div></details>";
}
var procTag="Todas";
function viewProc(root){
  var tags=["Todas"].concat(PROCS.map(function(p){return p.tag}).filter(function(s,i,a){return a.indexOf(s)===i}));
  root.innerHTML="<div class=\"chips\" id=\"ptags\" role=\"group\" aria-label=\"Tipo de técnica\">"+tags.map(function(s){return "<button type=\"button\" class=\"chip\" data-t=\""+esc(s)+"\" aria-pressed=\""+(s===procTag)+"\">"+esc(s)+"</button>"}).join("")+"</div><div class=\"pstat\" id=\"pstat\"></div><p class=\"lead\" style=\"margin-top:0\">Tocá cada paso para marcarlo mientras practicás.</p><div id=\"plist\"></div>";
  var list=$("#plist",root);
  var draw=function(){list.innerHTML=PROCS.filter(function(p){return procTag==="Todas"||p.tag===procTag}).map(procHtml).join("");procStat()};
  var upd=function(d){
    var all=$$(".step",d),done=all.filter(function(b){return b.getAttribute("aria-pressed")==="true"}).length;
    $(".cnt",d).textContent=done+" de "+all.length;
    $(".bar i",d).style.width=(done/all.length*100)+"%";
    all.forEach(function(b){b.classList.remove("next")});
    var nx=all.filter(function(b){return b.getAttribute("aria-pressed")!=="true"})[0];
    if(nx)nx.classList.add("next");
    var bn=$(".done-banner",d);
    if(done===all.length){if(!d.dataset.cel){d.dataset.cel="1";procDone(d)}}
    else{d.dataset.cel="";if(bn)bn.parentNode.removeChild(bn)}
  };
  list.addEventListener("toggle",function(e){if(e.target.open)upd(e.target)},true);
  list.addEventListener("click",function(e){
    var d=e.target.closest("details");if(!d)return;
    var s=e.target.closest(".step");
    if(s){s.setAttribute("aria-pressed",String(s.getAttribute("aria-pressed")!=="true"));upd(d);return}
    if(e.target.closest(".reset")){$$(".step",d).forEach(function(b){b.setAttribute("aria-pressed","false")});upd(d)}
  });
  $("#ptags",root).addEventListener("click",function(e){
    var b=e.target.closest(".chip");if(!b)return;
    procTag=b.dataset.t;
    $$(".chip",root).forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});
    draw();
  });
  draw();
}

var quizRoot=null;
function quizStart(){
  var best=store.get("best",null);
  quizRoot.innerHTML="<section class=\"card\"><h2>Repaso rápido</h2><p class=\"lead\">10 preguntas al azar sobre cálculos, técnicas y patologías. Hay "+QUIZ.length+" preguntas en total.</p>"+(best!==null?"<p class=\"tip\">Tu mejor resultado: "+best+" de 10.</p>":"")+"<button type=\"button\" class=\"btn\" id=\"q-go\">Empezar</button></section>";
  $("#q-go",quizRoot).addEventListener("click",function(){
    Q={ids:shuffle(QUIZ.map(function(_,i){return i})).slice(0,10),i:0,score:0,missed:[],sel:null};
    quizAsk();
  });
}
function quizAsk(){
  var it=QUIZ[Q.ids[Q.i]];
  Q.order=shuffle(it.o.map(function(_,i){return i}));Q.sel=null;
  quizRoot.innerHTML="<section class=\"card\"><div class=\"qhead\"><span>Pregunta "+(Q.i+1)+" de "+Q.ids.length+"</span><span>"+esc(it.t)+"</span></div><div class=\"prog\" style=\"margin:0\"><span class=\"bar\"><i style=\"width:"+(Q.i/Q.ids.length*100)+"%\"></i></span></div><p class=\"qtext\">"+esc(it.q)+"</p><div id=\"opts\">"+Q.order.map(function(k){return "<button type=\"button\" class=\"opt\" data-k=\""+k+"\">"+esc(it.o[k])+"</button>"}).join("")+"</div><div id=\"fb\"></div></section>";
  $("#opts",quizRoot).addEventListener("click",function(e){
    var b=e.target.closest(".opt");if(!b||Q.sel!==null)return;
    var k=Number(b.dataset.k);Q.sel=k;
    var ok=k===it.a;
    if(ok){Q.score++;Q.streak=(Q.streak||0)+1;addPts(1)}else{Q.missed.push(Q.ids[Q.i]);Q.streak=0}
    $$(".opt",quizRoot).forEach(function(x){
      x.disabled=true;
      var xk=Number(x.dataset.k);
      if(xk===it.a)x.classList.add("right");
      else if(xk===k)x.classList.add("wrong");
    });
    var last=Q.i===Q.ids.length-1;
    $("#fb",quizRoot).innerHTML="<p class=\"verdict "+(ok?"ok":"crit")+"\">"+(ok?"Correcto"+(Q.streak>1?" · racha de "+Q.streak:""):"Incorrecto")+"</p><p class=\"tip\">"+esc(it.e)+"</p><button type=\"button\" class=\"btn\" id=\"q-next\">"+(last?"Ver resultado":"Siguiente")+"</button>";
    $("#q-next",quizRoot).addEventListener("click",function(){
      if(last)quizEnd();else{Q.i++;quizAsk()}
    });
    $("#q-next",quizRoot).focus();
  });
}
function quizEnd(){
  var n=Q.ids.length,s=Q.score;
  var best=store.get("best",null);
  if(best===null||s>best)store.set("best",s);
  var msg=s>=9?"Excelente nivel.":s>=7?"Muy bien, ya casi lo tenés.":s>=5?"Vas por buen camino. Repasá los temas fallados.":"Conviene repasar los temas antes de volver a intentar.";
  var miss=Q.missed.length?"<h3 class=\"sec\">Para repasar</h3><ul class=\"missed\">"+Q.missed.map(function(id){var it=QUIZ[id];return "<li><b>"+esc(it.t)+"</b>"+esc(it.q)+"<br><span class=\"tip\">Respuesta: "+esc(it.o[it.a])+". "+esc(it.e)+"</span></li>"}).join("")+"</ul>":"";
  quizRoot.innerHTML="<section class=\"card\"><h2>Resultado</h2>"+stars(s,n)+"<p class=\"score\">"+s+" de "+n+"</p><p class=\"lead\" style=\"margin-bottom:0\">"+msg+"</p>"+miss+"<div class=\"row\"><button type=\"button\" class=\"btn\" id=\"q-again\">Jugar de nuevo</button></div></section>";
  $("#q-again",quizRoot).addEventListener("click",function(){
    Q={ids:shuffle(QUIZ.map(function(_,i){return i})).slice(0,10),i:0,score:0,missed:[],sel:null};
    quizAsk();
  });
}
function viewQuiz(root){quizRoot=root;quizStart()}

/* ---------------- ECG ---------------- */
var ECG_QRS={
  norm:[[0.012,-0.08,0.006],[0.035,1.1,0.011],[0.058,-0.22,0.009]],
  wide:[[0.06,1.25,0.03],[0.13,-0.5,0.032]],
  brd:[[0.02,0.25,0.01],[0.05,-0.7,0.012],[0.098,0.95,0.019]],
  bri:[[0.05,0.9,0.022],[0.108,0.8,0.022]],
  wpw:[[0.004,0.38,0.026],[0.075,1.0,0.024],[0.108,-0.15,0.012]]
};
var ECG_T={norm:0.3,wide:-0.45,brd:-0.25,bri:-0.35,wpw:0.15};
var ECG_END=5.3;
function gz(t,c,a,s){var z=(t-c)/s;return a*Math.exp(-z*z/2)}
function rngf(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function ecgBeat(t,b){
  var k=b.q||"norm",q=ECG_QRS[k],y=0,i;
  for(i=0;i<q.length;i++)y+=gz(t,q[i][0],q[i][1]*(b.ra||1),q[i][2]);
  var qt=b.qt||0.38,tc=qt*0.72,ts=qt*0.12*(b.tw||1);
  y+=gz(t,tc,b.ta===undefined?ECG_T[k]:b.ta,ts);
  if(b.st)y+=gz(t,(0.09+tc)/2,b.st,(tc-0.09)/2.2);
  if(b.u)y+=gz(t,tc+0.19,b.u,0.04);
  if(b.pd)y+=gz(t,-0.05,-b.pd,0.03);
  return y;
}
function ecgSignal(def){
  return function(t){
    var y=0,i,b,p;
    for(i=0;i<def.beats.length;i++){b=def.beats[i];if(t>b.t-0.2&&t<b.t+0.9)y+=ecgBeat(t-b.t,b)}
    for(i=0;i<def.ps.length;i++){p=def.ps[i];if(Math.abs(t-p.t-0.045)<0.2)y+=gz(t,p.t+0.045,p.a===undefined?0.12:p.a,0.022)}
    if(def.extra)y+=def.extra(t);
    return y;
  };
}
function ecgReg(start,rr,props,pr,pa,end){
  var d={beats:[],ps:[]},t,e=end||ECG_END;
  for(t=start;t<e;t+=rr){d.beats.push(Object.assign({t:t},props));if(pr)d.ps.push({t:t-pr,a:pa})}
  return d;
}
function ecgBlock(t0,per,prs,props){
  var d={beats:[],ps:[]},t=t0,k=0,pr;
  while(t<ECG_END-0.2){d.ps.push({t:t});pr=prs[k%prs.length];if(pr!==null)d.beats.push(Object.assign({t:t+pr},props));t+=per;k++}
  return d;
}
var ECG_GEN={
  nsr:function(){return ecgReg(0.5,0.8,{},0.16)},
  brad:function(){return ecgReg(0.7,1.4,{qt:0.44},0.18)},
  taqui:function(){return ecgReg(0.35,0.46,{qt:0.27,ta:0.22},0.12)},
  pac:function(){
    var d={beats:[],ps:[]},tq=[0.5,1.3,2.1,2.75,3.6,4.4],i;
    for(i=0;i<tq.length;i++){d.beats.push({t:tq[i]});d.ps.push(i===3?{t:tq[i]-0.13,a:-0.07}:{t:tq[i]-0.16})}
    return d;
  },
  pvc:function(){
    var d={beats:[],ps:[]},tq=[0.5,1.3,1.9,2.9,3.7,4.5],i;
    for(i=0;i<tq.length;i++){
      if(i===2)d.beats.push({t:tq[i],q:"wide",qt:0.42});
      else{d.beats.push({t:tq[i]});d.ps.push({t:tq[i]-0.16})}
    }
    return d;
  },
  afib:function(r){
    var d={beats:[],ps:[]},t=0.3,p1=r()*6,p2=r()*6,p3=r()*6;
    while(t<ECG_END){d.beats.push({t:t,ta:0.1,ra:0.85+r()*0.25,qt:0.3});t+=0.36+r()*0.6}
    d.extra=function(x){return 0.045*(Math.sin(2*Math.PI*5.8*x+p1)+0.8*Math.sin(2*Math.PI*7.4*x+p2)+0.6*Math.sin(2*Math.PI*4.7*x+p3))};
    return d;
  },
  flutter:function(){
    var d=ecgReg(0.45,0.8,{ta:0.06},0);
    d.extra=function(x){var ph=(x/0.2)%1;return ph<0.92?0.085-0.17*(ph/0.92):-0.085+0.17*((ph-0.92)/0.08)};
    return d;
  },
  tsv:function(){return ecgReg(0.3,0.33,{qt:0.22,ta:0.12,ra:0.9},0)},
  vt:function(){return ecgReg(0.3,0.36,{q:"wide",qt:0.3},0)},
  torsades:function(){
    var d=ecgReg(0.35,0.9,{qt:0.56},0.16,undefined,2.0);
    d.extra=function(x){var u=x-1.75;if(u<0)return 0;return Math.min(1,u/0.35)*(0.2+0.9*Math.abs(Math.sin(Math.PI*u/1.6)))*Math.sin(2*Math.PI*3.8*u)};
    return d;
  },
  vf:function(r){
    var p1=r()*6,p2=r()*6,p3=r()*6;
    return {beats:[],ps:[],extra:function(x){return (0.35+0.3*Math.sin(2*Math.PI*0.45*x+p1))*Math.sin(2*Math.PI*4.3*x+1.4*Math.sin(2*Math.PI*0.7*x+p2))+0.22*Math.sin(2*Math.PI*6.9*x+p3)*Math.sin(2*Math.PI*0.9*x)}};
  },
  asis:function(){return {beats:[],ps:[],extra:function(x){return 0.02*Math.sin(2*Math.PI*0.35*x)+0.008*Math.sin(2*Math.PI*1.7*x)}}},
  bav1:function(){return ecgReg(0.8,0.95,{},0.34)},
  mob1:function(){return ecgBlock(0.25,0.85,[0.16,0.28,0.35,null],{})},
  mob2:function(){return ecgBlock(0.3,0.9,[0.18,0.18,0.18,null],{})},
  bav3:function(){
    var d={beats:[],ps:[]},t,i,q=[0.95,2.65,4.35];
    for(t=0.15;t<ECG_END;t+=0.72)d.ps.push({t:t});
    for(i=0;i<q.length;i++)d.beats.push({t:q[i],q:"wide",qt:0.48});
    return d;
  },
  stemi:function(){return ecgReg(0.5,0.8,{st:0.5,ta:0.35,qt:0.4},0.16)},
  isq:function(){return ecgReg(0.5,0.8,{st:-0.22,ta:0.1},0.16)},
  tinv:function(){return ecgReg(0.5,0.8,{ta:-0.32,qt:0.4},0.16)},
  hiperk:function(){return ecgReg(0.5,0.75,{ta:0.9,tw:0.62,ra:0.9},0.15,0.04)},
  hipok:function(){return ecgReg(0.5,0.85,{ta:0.08,st:-0.14,u:0.22,qt:0.4},0.16)},
  qtl:function(){return ecgReg(0.5,1.0,{qt:0.56},0.16)},
  peri:function(){return ecgReg(0.5,0.8,{st:0.24,pd:0.09},0.16)},
  brd:function(){return ecgReg(0.5,0.8,{q:"brd"},0.16)},
  bri:function(){return ecgReg(0.5,0.8,{q:"bri"},0.16)},
  wpw:function(){return ecgReg(0.5,0.8,{q:"wpw"},0.1)}
};
function ecgSvg(k,seed,label){
  var f=ecgSignal(ECG_GEN[k](rngf(seed||7))),pts=[],t,y;
  for(t=0;t<=5.0001;t+=0.008){y=24-f(t)*10;y=Math.max(1.5,Math.min(38.5,y));pts.push((t*25).toFixed(1)+","+y.toFixed(1))}
  return "<svg class=\"ecg\" viewBox=\"0 0 125 40\" role=\"img\" aria-label=\""+esc(label||"Trazado de ECG")+"\"><rect width=\"125\" height=\"40\" fill=\"url(#gm)\"/><rect width=\"125\" height=\"40\" fill=\"url(#gM)\"/><path class=\"trace\" d=\"M"+pts.join("L")+"\"/></svg>";
}
function ecgAnno(){
  var tq=0.4,pr=0.16,f=ecgSignal({beats:[{t:tq}],ps:[{t:tq-pr}]}),base=28,pts=[],t,tc=0.38*0.72;
  var X=function(v){return (v-0.05)*100};
  for(t=0.05;t<=1.35;t+=0.01)pts.push(X(t).toFixed(1)+","+(base-f(t)*14).toFixed(1));
  var bar=function(a,b,y,lab){
    var x1=X(a),x2=X(b);
    return "<path class=\"dim\" d=\"M"+x1.toFixed(1)+" "+(y-1.5)+"V"+(y+1.5)+"M"+x1.toFixed(1)+" "+y+"H"+x2.toFixed(1)+"M"+x2.toFixed(1)+" "+(y-1.5)+"V"+(y+1.5)+"\"/><text x=\""+((x1+x2)/2).toFixed(1)+"\" y=\""+(y+6)+"\" text-anchor=\"middle\">"+lab+"</text>";
  };
  var lbl=function(tt,y,s){return "<text x=\""+X(tt).toFixed(1)+"\" y=\""+y+"\" text-anchor=\"middle\">"+s+"</text>"};
  return "<svg class=\"anno\" viewBox=\"0 0 130 62\" role=\"img\" aria-label=\"Esquema de un latido normal con onda P, complejo QRS, segmento ST, onda T y los intervalos PR, QRS y QT\"><rect width=\"130\" height=\"62\" rx=\"3\" style=\"fill:var(--ecg-bg)\"/><path class=\"baseline\" d=\"M0 28H130\"/><path class=\"trace\" d=\"M"+pts.join("L")+"\"/>"
    +lbl(tq-pr+0.045,22.5,"P")+lbl(tq+0.035,10,"R")+lbl(tq+tc,20.5,"T")+lbl(tq+0.17,34,"ST")
    +bar(tq-pr,tq,42,"PR")+bar(tq,tq+0.09,42,"QRS")+bar(tq,tq+0.38,52,"QT")+"</svg>";
}

function ecgRitmos(body){

  var draw=function(){
    var l=$("#elist",body);
    l.innerHTML=ECGR.filter(function(x){return x.grp==="ritmos"&&(ecgTag==="Todos"||x.tag===ecgTag)}).map(ecgItem).join("");
    ecgBindStrips(l);
  };
  $("#etags",body).addEventListener("click",function(e){
    var b=e.target.closest(".chip");if(!b)return;

  });

}
