function ecgPractice(body){
  var best=store.get("ebest",null),pools=["Todo","Ritmos","Isquemia y otros","Marcapasos y más"];
  body.innerHTML="<div class=\"chips\" id=\"epool\" role=\"group\" aria-label=\"Qué practicar\">"+pools.map(function(s){return "<button type=\"button\" class=\"chip\" data-p=\""+s+"\" aria-pressed=\""+(s===epPool)+"\">"+s+"</button>"}).join("")+"</div><section class=\"card\"><h2>¿Qué trazado es?</h2><p class=\"lead\">10 trazados al azar. Mirá si el ritmo es regular, si hay una P antes de cada QRS y qué tan ancho es el QRS.</p>"+(best!==null?"<p class=\"tip\">Tu mejor resultado: "+best+" de 10.</p>":"")+"<button type=\"button\" class=\"btn\" id=\"ep-go\">Empezar</button></section>";
  $("#epool",body).addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;epPool=b.dataset.p;ecgPractice(body)});
  $("#ep-go",body).addEventListener("click",function(){
    var pool=ECGR.filter(function(x){return epPool==="Todo"||(epPool==="Ritmos"&&x.grp==="ritmos")||(epPool==="Isquemia y otros"&&x.grp==="otros")||(epPool==="Marcapasos y más"&&x.grp==="avanz")});
    var q=shuffle(pool).slice(0,10);
    EP={q:q,seeds:q.map(function(){return 1+Math.floor(Math.random()*100000)}),pool:pool,i:0,score:0,missed:[]};
    epAsk(body);
  });
}
function epAsk(body){
  var it=EP.q[EP.i],n=EP.q.length;
  var opts=shuffle([it].concat(shuffle(EP.pool.filter(function(x){return x.k!==it.k})).slice(0,3)));
  body.innerHTML="<section class=\"card\"><div class=\"qhead\"><span>Trazado "+(EP.i+1)+" de "+n+"</span><span>Aciertos: "+EP.score+"</span></div><div class=\"prog\" style=\"margin:0 0 10px\"><span class=\"bar\"><i style=\"width:"+(EP.i/n*100)+"%\"></i></span></div>"+ecgSvg(it.k,EP.seeds[EP.i],"Trazado de ECG para identificar")+"<p class=\"strip-cap\" id=\"ecap\">25 mm/s · 10 mm/mV</p><p class=\"qtext\">¿Qué muestra este trazado?</p><div id=\"eopts\">"+opts.map(function(o){return "<button type=\"button\" class=\"opt\" data-k=\""+o.k+"\">"+esc(o.n)+"</button>"}).join("")+"</div><div id=\"efb\"></div></section>";
  var done=false;
  $("#eopts",body).addEventListener("click",function(e){
    var b=e.target.closest(".opt");if(!b||done)return;
    done=true;
    var ok=b.dataset.k===it.k;
    if(ok){EP.score++;addPts(1)}else EP.missed.push(it);
    $$(".opt",body).forEach(function(x){x.disabled=true;if(x.dataset.k===it.k)x.classList.add("right");else if(x===b)x.classList.add("wrong")});
    $("#ecap",body).textContent="Derivación "+it.lead+" · 25 mm/s · 10 mm/mV";
    var last=EP.i===n-1;
    $("#efb",body).innerHTML="<p class=\"verdict "+(ok?"ok":"crit")+"\">"+(ok?"Correcto":"Era: "+esc(it.n))+"</p><h3 class=\"sec\" style=\"margin-top:0\">Cómo se reconoce</h3>"+eUl(it.rec.slice(0,3))+"<p class=\"key\">"+esc(it.key)+"</p><div class=\"row\"><button type=\"button\" class=\"btn\" id=\"e-next\">"+(last?"Ver resultado":"Siguiente")+"</button></div>";
    var nx=$("#e-next",body);
    nx.addEventListener("click",function(){if(last)epEnd(body);else{EP.i++;epAsk(body)}});
    nx.focus();
  });
}
function epEnd(body){
  var s=EP.score,n=EP.q.length,best=store.get("ebest",null);
  if(best===null||s>best)store.set("ebest",s);
  var msg=s>=9?"Excelente lectura.":s>=7?"Muy bien. Repasá los ritmos que fallaste.":s>=5?"Vas por buen camino. Volvé al método de lectura.":"Conviene repasar los ritmos y el método antes de volver a intentar.";
  var miss=EP.missed.length?"<h3 class=\"sec\">Para repasar</h3><ul class=\"missed\">"+EP.missed.map(function(it){return "<li><b>"+esc(it.n)+"</b>"+esc(it.rec[0])+"<br><span class=\"tip\">"+esc(it.key)+"</span></li>"}).join("")+"</ul>":"";
  body.innerHTML="<section class=\"card\"><h2>Resultado</h2>"+stars(s,n)+"<p class=\"score\">"+s+" de "+n+"</p><p class=\"lead\" style=\"margin-bottom:0\">"+msg+"</p>"+miss+"<div class=\"row\"><button type=\"button\" class=\"btn\" id=\"e-again\">Practicar de nuevo</button></div></section>";
  $("#e-again",body).addEventListener("click",function(){ecgPractice(body)});
}

function viewEcg(root){
  var secs=[["metodo","Método"],["ritmos","Ritmos"],["isquemia","Isquemia y otros"],["avanz","Marcapasos y más"],["doce","12 derivaciones"],["practica","Práctica"]];
  root.innerHTML="<div class=\"chips groups\" id=\"esec\" role=\"group\" aria-label=\"Secciones de ECG\">"+secs.map(function(s){return "<button type=\"button\" class=\"chip\" data-s=\""+s[0]+"\" aria-pressed=\""+(s[0]===ecgSec)+"\">"+s[1]+"</button>"}).join("")+"</div><div id=\"ebody\"></div>";
  var body=$("#ebody",root),bar=$("#esec",root);
  var draw=function(){({metodo:ecgMetodo,ritmos:ecgRitmos,isquemia:ecgIsq,avanz:ecgAvanz,doce:ecg12,practica:ecgPractice})[ecgSec](body)};
  bar.addEventListener("click",function(e){
    var b=e.target.closest(".chip");if(!b)return;
    ecgSec=b.dataset.s;store.set("esec",ecgSec);
    $$(".chip",bar).forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});
    draw();
  });
  draw();
}

function confetti(host){
  var reduce=false;
  try{reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
  if(reduce)return;
  var box=document.createElement("div"),cols=["var(--accent-btn)","var(--ink)","var(--g2)","var(--screen-ink)"],i,p;
  box.className="confetti";box.setAttribute("aria-hidden","true");
  for(i=0;i<22;i++){
    p=document.createElement("i");
    p.style.left=(Math.random()*100)+"%";
    p.style.background=cols[i%cols.length];
    p.style.animationDelay=(Math.random()*0.4)+"s";
    p.style.transform="rotate("+Math.floor(Math.random()*180)+"deg)";
    box.appendChild(p);
  }
  host.appendChild(box);
  setTimeout(function(){if(box.parentNode)box.parentNode.removeChild(box)},2200);
}

 steps:["Higiene de manos, equipo de protección y material estéril: cánula interna, gasas, suero fisiológico y aspiración.","Conocé el número y el tipo de cánula: con o sin balón, con o sin cánula interna.","Aspirá secreciones si es necesario, con sonda estéril y por menos de 15 segundos.","Retirá y limpiá la cánula interna según indicación, o cambiala por una limpia.","Limpiá el estoma con suero fisiológico desde el centro hacia afuera y secá bien.","Cambiá el apósito y las cintas de sujeción cuando estén sucios, con la cánula sostenida.","Controlá la presión del balón si lo tiene.","Dejá junto al paciente una cánula de repuesto del mismo número y otra más chica."],
 key:"Si la cánula se sale en los primeros días, es una emergencia: el trayecto todavía no está formado.",
 err:["Aspirar sin preoxigenar","Ajustar las cintas muy fuerte o muy flojas","No tener la cánula de repuesto en la habitación"]},
{n:"Destete y extubación",tag:"UCI",d:"Proceso de retiro gradual del soporte ventilatorio y del tubo.",
 steps:["Verificá que se cumplan los criterios de inicio: causa resuelta, hemodinamia estable, buen intercambio de gases y paciente que despierta.","Interrumpí la sedación según el protocolo del servicio.","Hacé la prueba de respiración espontánea (por ejemplo, 30–120 minutos con presión de soporte baja o pieza en T).","Observá FR, saturación, FC, presión arterial, esfuerzo y estado mental durante toda la prueba.","Si la tolera, el médico decide la extubación. Aspirá la boca y el tubo antes.","Retirá la fijación, desinflá el cuff y extraé el tubo mientras el paciente exhala o tose.","Colocá oxígeno (o ventilación no invasiva o alto flujo si está indicado).","Controlá el estridor, el esfuerzo respiratorio y la voz en las horas siguientes."],
 key:"La falla de la prueba se reconoce por taquipnea, taquicardia, sudoración, desaturación o agitación.",
 err:["Extubar sin aspirar bien la boca","No tener material de reintubación a mano","No vigilar el estridor después"]},
{n:"Gasometría arterial: extracción",tag:"Sangre",d:"Punción arterial radial o toma desde una línea arterial para medir gases en sangre.",
 steps:["Verificá la indicación, la FiO₂ o el flujo de oxígeno y registralos en la hoja.","Higiene de manos, guantes y jeringa heparinizada.","Realizá la prueba de Allen para confirmar circulación colateral cubital.","Palpá el pulso radial, desinfectá y puncioná en ángulo de 30–45° hasta obtener sangre pulsátil.","Dejá que la jeringa se llene sola; extraé 1–2 ml.","Retirá la aguja, presioná durante al menos 5 minutos (más si hay anticoagulación).","Eliminá las burbujas de aire, cerrá y rotulá.","Procesá de inmediato o enviá en hielo según el protocolo del laboratorio.","Controlá el pulso, el color y la sensibilidad de la mano."],
 key:"Las burbujas de aire alteran la PaO₂ y la PaCO₂: eliminalas antes de enviar la muestra.",
 err:["Presionar poco tiempo y causar hematoma","No registrar la FiO₂","Dejar burbujas en la jeringa"]},
{n:"Línea arterial: cuidados y medición",tag:"UCI",d:"Cuidado del catéter arterial para medición continua de la presión y toma de muestras.",
 steps:["Verificá el sistema: bolsa a presión de 300 mmHg con suero y flujo continuo de unos 3 ml/h.","Colocá el transductor a la altura del eje flebostático (4.º espacio intercostal, línea axilar media).","Poné a cero el sistema abriendo a la atmósfera, y repetí cada cambio de posición.","Controlá la curva: debe ser nítida; si está amortiguada, buscá burbujas, acodamientos o coágulos.","Valorá la mano o el pie distal: color, temperatura, pulso y sensibilidad.","Para tomar muestra, descartá el volumen indicado, tomá la muestra y lavá el sistema.","Revisá el apósito y las conexiones: todas bien fijas y visibles.","Rotulá la línea como arterial; nunca administres medicación por ella."],
 key:"Si el transductor está por encima del corazón, la presión sale falsamente baja; si está por debajo, falsamente alta.",
 err:["No poner a cero después de mover al paciente","Inyectar fármacos por la línea arterial","No valorar la perfusión distal"]},
{n:"Catéter venoso central y medición de PVC",tag:"UCI",d:"Cuidados del acceso central y medición de la presión venosa central.",
 steps:["Higiene de manos y uso de técnica aséptica en cada manipulación.","Identificá cada luz y rotulala; los vasopresores van por una luz dedicada.","Desinfectá los conectores antes de cada uso.","Revisá el apósito: debe estar limpio, seco e íntegro.","Para la PVC, colocá al paciente en posición supina y el transductor a la altura de la aurícula.","Poné a cero y leé al final de la espiración, observando la curva.","Registrá el valor, la posición y la hora.","Valorá cada día si el catéter sigue siendo necesario."],
 key:"Interpretá la PVC por su tendencia y junto con la clínica, no como un número aislado.",
 err:["Medir con el paciente en otra posición","Interrumpir la infusión de vasopresores para otras tareas","Dejar un apósito húmedo"]},
{n:"Administración segura de drogas vasoactivas",tag:"UCI",d:"Manejo de noradrenalina, dopamina, dobutamina y otros fármacos en infusión continua.",
 steps:["Verificá la indicación, la dilución, la concentración y la meta (por ejemplo, PAM mayor o igual a 65 mmHg).","Confirmá la vía: idealmente un catéter central dedicado; si es periférica, solo por tiempo limitado, según el protocolo.","Programá la bomba con la concentración correcta y revisá el cálculo con otro profesional.","Ajustá la dosis solo con indicación o según el protocolo escrito del servicio.","Controlá la presión arterial de forma continua y la frecuencia cardíaca.","Vigilá el sitio de inserción: palidez, frío, dolor o extravasación.","Programá el recambio de la jeringa antes de que se agote y solapá infusiones para no cortar el goteo.","Nunca administres un bolo por la misma luz ni purgues la línea con la infusión en curso."],
 key:"No interrumpas una infusión de vasopresor: el paciente puede caer en minutos.",
 err:["Cambiar una concentración sin recalcular","Lavar la línea con el fármaco corriendo","Esperar a que se agote la jeringa para preparar la siguiente"]},
{n:"Sedoanalgesia: valoración y ajuste",tag:"UCI",d:"Valorar dolor, sedación y delirium en el paciente crítico de forma rutinaria.",
 steps:["Valorá el dolor al menos cada turno, con una escala numérica o, si no habla, con CPOT.","Valorá la sedación con RASS y compará con la meta indicada.","Antes de aumentar la sedación, buscá la causa de la agitación: dolor, hipoxia, retención urinaria.","Priorizá la analgesia antes de la sedación (analgesia primero).","Interrumpí la sedación cada día si el médico lo indicó y observá la respuesta.","Valorá el delirium con CAM-ICU o la escala del servicio.","Registrá las dosis administradas y los cambios."],
 key:"Analgesia primero, sedación mínima: el paciente más despierto sale antes de la ventilación.",
 err:["Sedar a un paciente que tiene dolor","Aumentar la sedación sin buscar causas","No registrar la escala"]},
{n:"Paro cardíaco: algoritmo y desfibrilación",tag:"Emergencia",d:"Secuencia de reanimación avanzada con monitor y desfibrilador.",
 steps:["Reconocé el paro: no responde, no respira normalmente, sin pulso. Activá el equipo y pedí el carro de paro.","Compresiones inmediatas: 100–120 por minuto, 5–6 cm de profundidad, permitiendo la reexpansión del tórax.","Conectá el monitor o desfibrilador y analizá el ritmo.","Si es FV o TV sin pulso: cargá y desfibrilá (bifásico según el fabricante, habitualmente 120–200 J) y reiniciá las compresiones de inmediato.","Ciclos de 2 minutos con reevaluación del ritmo. Cambiá al que comprime cada 2 minutos.","Acceso IV o intraóseo; adrenalina 1 mg cada 3–5 minutos según indicación.","En FV o TV refractaria, amiodarona según indicación.","Vía aérea avanzada: una ventilación cada 6 segundos sin pausar las compresiones.","Buscá y tratá causas reversibles (Hs y Ts) y registrá cada acción con su hora."],
 key:"Descargá y seguí comprimiendo: no se espera a ver el ritmo para retomar las compresiones.",
 err:["Interrumpir las compresiones por más de 10 segundos","Hiperventilar","Tocar al paciente durante la descarga"]},
{n:"Cuidados de la hipertensión endocraneana",tag:"UCI",d:"Cuidados para proteger al cerebro del paciente con aumento de la presión intracraneal.",
 steps:["Cabecera a 30° y cabeza en línea media, sin que la fijación del tubo comprima el cuello.","Controlá pupilas, Glasgow y la tendencia neurológica con la frecuencia indicada.","Mantené la presión arterial y la saturación en las metas indicadas.","Evitá la hipertermia y tratá la fiebre.","Agrupá los cuidados y dejá intervalos de descanso entre maniobras.","Aspirá solo cuando sea necesario y por poco tiempo.","Controlá la PIC y la PPC si hay monitoreo.","Administrá la osmoterapia indicada y controlá sodio y osmolaridad."],
 key:"Evitá todo lo que eleve la PIC: tos, agitación, fiebre, hipoxia, hipercapnia y cuello rotado.",
 err:["Rotar o flexionar el cuello","Aspirar largo tiempo","No avisar un cambio pupilar"]},
{n:"Terapia de reemplazo renal continua",tag:"UCI",d:"Cuidados del paciente en hemofiltración o hemodiafiltración continua.",
 steps:["Verificá el acceso (catéter de doble luz): permeabilidad, apósito y fijación.","Conocé la prescripción: modalidad, dosis, flujos, balance y anticoagulación.","Controlá las presiones del circuito y las alarmas, y respondé cada una.","Medí el balance: lo extraído y lo reinfundido, y registralo cada hora.","Vigilá la hemodinamia: las pérdidas excesivas causan hipotensión.","Controlá la temperatura: el circuito enfría al paciente.","Controlá el sangrado y la coagulación si hay anticoagulación.","Controlá potasio, calcio, magnesio y fosfato según el protocolo.","Ajustá la dosis de fármacos según la función renal y la eliminación por el filtro."],
 key:"La coagulación del filtro es la causa más común de que el tratamiento se interrumpa: vigilá las presiones.",
 err:["Ignorar alarmas de presión","No registrar el balance horario","No abrigar al paciente"]},
{n:"Posición prono en SDRA",tag:"UCI",d:"Girar al paciente boca abajo para mejorar la oxigenación, con un equipo coordinado.",
 steps:["Verificá la indicación y la hora de inicio: se mantiene por lo general al menos 12–16 horas.","Reuní al equipo (por lo menos 4 personas) y designá a quien dirige y protege la cabeza y el tubo.","Preoxigená, aspirá y asegurá tubo, vías, sondas y drenajes; pausá la nutrición enteral.","Colocá los electrodos en la espalda y protegé los ojos.","Girá al paciente de manera coordinada, mantené la alineación y acomodá almohadas en tórax y pelvis.","Colocá los brazos en posición cómoda, giro de la cabeza cada 2 horas.","Protegé las prominencias: cara, hombros, codos, mamas, genitales, rodillas.","Vigilá saturación, presión y tubo, y registrá la respuesta.","Tené un plan para volver a supino rápido en emergencia o en paro."],
 key:"Es seguro si hay un equipo entrenado y un líder. Los accidentes ocurren por tubos y vías que se salen.",
 err:["Girar sin coordinación","No proteger la cara y los ojos","No tener el plan de emergencia"]}
];

};

function ecgAvanz(body){

{n:"Nitroprusiato",c:"Vasoactivos",uso:"Crisis hipertensivas graves e insuficiencia cardíaca aguda.",dosis:"0,3–10 mcg/kg/min, con la dosis más baja posible y por el menor tiempo.",adm:["Proteger el frasco y el equipo de la luz","Presión arterial invasiva o control muy frecuente","Usar solo con bomba y por vía exclusiva"],vig:["Presión arterial minuto a minuto","Signos de toxicidad por cianuro: acidosis, confusión"],ala:["Hipotensión brusca","Acidosis láctica o alteración neurológica"],key:"Es potente y de acción inmediata: la presión se vigila de forma continua."},

{n:"Midazolam",c:"Sedoanalgesia",uso:"Sedación, convulsiones y ansiolisis.",dosis:"Bolo de 1–2 mg IV; infusión de 0,02–0,1 mg/kg/h. En convulsión, según protocolo.",adm:["Bolos lentos","Ajustar en pacientes mayores, con insuficiencia hepática o renal"],vig:["Nivel de sedación y respiración","Presión arterial","Delirium: las benzodiacepinas aumentan el riesgo"],ala:["Depresión respiratoria","Acumulación con infusiones prolongadas"],key:"Antídoto: flumazenil, con cuidado en pacientes que usan benzodiacepinas de forma crónica."},

{n:"Ketamina",c:"Sedoanalgesia",uso:"Inducción en pacientes inestables, analgesia y sedación.",dosis:"Inducción: 1–2 mg/kg IV. Analgesia: 0,1–0,5 mg/kg.",adm:["Inyección lenta"],vig:["Presión arterial y frecuencia cardíaca: suelen subir","Secreciones aumentadas","Alucinaciones o agitación al despertar"],ala:["Hipertensión","Emergencia psicótica"],key:"Mantiene la presión y la respiración: por eso se prefiere en el paciente inestable."},

var FARM_CATS=["Todos","Vasoactivos","Sedoanalgesia","Relajantes","Cardio","Otros"];
var farmQ="",farmCat="Todos";
function farmList(){
  var q=farmQ.trim().toLowerCase(),ul=function(a){return "<ul>"+a.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+"</ul>"};
  var items=FARM.filter(function(d){return (farmCat==="Todos"||d.c===farmCat)&&(!q||(d.n+" "+d.uso+" "+d.c).toLowerCase().indexOf(q)>-1)});
  if(!items.length)return "<p class=\"lead\">No hay resultados.</p>";
  return items.map(function(d){
    return "<details class=\"acc\"><summary><span class=\"ico\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"9\" width=\"18\" height=\"6\" rx=\"3\" transform=\"rotate(-40 12 12)\"/><path d=\"M9.5 8.5l6 6\"/></svg></span><span><span class=\"acc-name\">"+esc(d.n)+"</span><br><span class=\"tag\">"+esc(d.c)+"</span></span></summary><div class=\"acc-body\"><p>"+esc(d.uso)+"</p><h3 class=\"sec\">Dosis de referencia (adulto)</h3><p>"+esc(d.dosis)+"</p><h3 class=\"sec\">Cómo se administra</h3>"+ul(d.adm)+"<h3 class=\"sec\">Qué vigilar</h3>"+ul(d.vig)+"<div class=\"alarm\"><h3 class=\"sec\">Avisar de inmediato</h3>"+ul(d.ala)+"</div><p class=\"key\">"+esc(d.key)+"</p></div></details>";
  }).join("");
}
function viewFarm(root){
  root.innerHTML="<div class=\"searchbox\"><input id=\"far-q\" type=\"search\" placeholder=\"Buscar fármaco\" aria-label=\"Buscar fármaco\" autocomplete=\"off\" value=\""+esc(farmQ)+"\"></div><div class=\"chips\" role=\"group\" aria-label=\"Grupo de fármacos\">"+FARM_CATS.map(function(s){return "<button type=\"button\" class=\"chip\" data-c=\""+s+"\" aria-pressed=\""+(s===farmCat)+"\">"+s+"</button>"}).join("")+"</div><p class=\"lead\" style=\"margin-top:0\">Dosis de referencia para adultos. La dosis la define la indicación médica y el protocolo de tu institución: verificá siempre.</p><div id=\"far-list\"></div>";
  var draw=function(){$("#far-list",root).innerHTML=farmList()};
  $("#far-q",root).addEventListener("input",function(e){farmQ=e.target.value;draw()});
  $(".chips",root).addEventListener("click",function(e){
    var b=e.target.closest(".chip");if(!b)return;
    farmCat=b.dataset.c;
    $$(".chip",root).forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});
    draw();
  });
  draw();
}

}
function viewProto(root){

  $("#proto-list",root).addEventListener("click",function(e){
    var b=e.target.closest("button.fn");if(!b)return;

function viewTec(root){

  var body=$("#tbody",root);
  var draw=function(){(protoMode==="pro"?viewProto:viewProc)(body)};
  $("#tmode",root).addEventListener("click",function(e){
    var b=e.target.closest(".chip");if(!b||b.dataset.m===protoMode)return;

    $$("#tmode .chip",root).forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});

}
